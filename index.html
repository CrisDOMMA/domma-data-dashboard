<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOMMA — Data Hub</title>
<style>
:root{
  --azul:#101637; --azul-medio:#2A3060; --rosa:#E7C6B9; --rosa-oscuro:#C4977F;
  --crema:#F8F7F5; --gris:#6B6B6B; --linea:#e8e8ea; --hover:#f3f3f5; --activo:#eceaf4;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;color:var(--azul);}
.layout{display:flex;height:100vh;overflow:hidden;}

/* SIDEBAR */
.sidebar{width:248px;min-width:248px;background:#fff;border-right:1px solid var(--linea);display:flex;flex-direction:column;height:100%;}
.sb-brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;}
.sb-logo{width:34px;height:34px;border-radius:9px;background:var(--azul);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;}
.sb-brand .t1{font-size:14px;font-weight:700;line-height:1.1;}
.sb-brand .t2{font-size:11px;color:var(--gris);}
.sb-org{margin:0 12px 8px;padding:9px 12px;border:1px solid var(--linea);border-radius:9px;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;}
.sb-org .chev{color:var(--gris);font-size:11px;}
.sb-group{padding:14px 20px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9a9aa3;font-weight:600;}
.sb-nav{padding:0 10px;display:flex;flex-direction:column;gap:2px;}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:13.5px;color:#2c2c34;cursor:pointer;border:none;background:none;text-align:left;width:100%;font-weight:500;}
.sb-item:hover{background:var(--hover);}
.sb-item.active{background:var(--activo);color:var(--azul);font-weight:700;}
.sb-item .ic{width:17px;text-align:center;font-size:15px;opacity:.85;}
.sb-spacer{flex:1;}
.sb-user{border-top:1px solid var(--linea);padding:12px;display:flex;align-items:center;gap:10px;}
.sb-avatar{width:32px;height:32px;border-radius:8px;background:var(--azul-medio);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
.sb-user .u1{font-size:13px;font-weight:600;line-height:1.1;}
.sb-user .u2{font-size:11px;color:var(--gris);}
.sb-logout{margin-left:auto;background:none;border:1px solid var(--linea);border-radius:7px;padding:5px 9px;font-size:12px;color:var(--gris);cursor:pointer;}
.sb-logout:hover{border-color:var(--rosa-oscuro);color:var(--azul);}

/* CONTENT */
.main{flex:1;height:100%;display:flex;flex-direction:column;min-width:0;}
#content{flex:1;width:100%;height:100%;border:none;}

/* LOGIN */
.login-overlay{position:fixed;inset:0;background:var(--azul);display:flex;align-items:center;justify-content:center;z-index:10000;}
.login-box{background:#fff;border-radius:16px;padding:40px;width:340px;max-width:90vw;box-shadow:0 10px 40px rgba(0,0,0,.3);text-align:center;}
.login-box .lg{width:46px;height:46px;border-radius:12px;background:var(--azul);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;margin-bottom:14px;}
.login-box h2{font-size:21px;color:var(--azul);margin-bottom:4px;}
.login-box .sub{font-size:13px;color:var(--gris);margin-bottom:24px;}
.login-box input{width:100%;padding:12px 14px;border:1px solid #ddd;border-radius:8px;margin-bottom:12px;font-size:14px;}
.login-box button{width:100%;padding:12px;border:none;border-radius:8px;background:var(--azul);color:#fff;font-size:14px;font-weight:600;cursor:pointer;}
.login-box button:hover{opacity:.9;}
.login-box .error{color:#d33;font-size:13px;margin-top:12px;display:none;}
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="lg">D</div>
    <h2>DOMMA Data Hub</h2>
    <p class="sub">Métricas de negocio &amp; datos de quiz</p>
    <input type="email" id="loginEmail" placeholder="tu@wearedomma.com">
    <input type="password" id="loginPass" placeholder="Contraseña">
    <button onclick="doLogin()">Acceder</button>
    <div class="error" id="loginError"></div>
  </div>
</div>

<div class="layout" id="app" style="display:none;">
  <aside class="sidebar">
    <div class="sb-brand">
      <div class="sb-logo">D</div>
      <div>
        <div class="t1">DOMMA</div>
        <div class="t2">Data Hub</div>
      </div>
    </div>
    <div class="sb-org">Domma <span class="chev">⌄</span></div>
    <div class="sb-group">Plataforma</div>
    <nav class="sb-nav">
      <button class="sb-item active" data-view="metrics" onclick="nav('metrics',this)"><span class="ic">📊</span> Métricas</button>
      <button class="sb-item" data-view="quiz" onclick="nav('quiz',this)"><span class="ic">🧬</span> Datos Quiz</button>
      <button class="sb-item" data-view="luna" onclick="nav('luna',this)"><span class="ic">🌙</span> Dashboard LUNA</button>
      <button class="sb-item" data-view="bajas" onclick="nav('bajas',this)"><span class="ic">🔄</span> Gestión suscripciones</button>
      <button class="sb-item" data-view="retencion" onclick="nav('retencion',this)"><span class="ic">💳</span> Fallos de pago</button>
    </nav>
    <div class="sb-spacer"></div>
    <div class="sb-user">
      <div class="sb-avatar">D</div>
      <div>
        <div class="u1">Administración</div>
        <div class="u2">Domma</div>
      </div>
      <button class="sb-logout" onclick="logout()">Salir</button>
    </div>
  </aside>
  <div class="main">
    <iframe id="content" title="Contenido"></iframe>
  </div>
</div>

<script>
const AUTH_API='https://domma-pro-api.cristina-ed1.workers.dev';
const VIEWS={ metrics:'/metrics?embed=1', quiz:'/quiz', luna:'/luna', bajas:'/bajas?embed=1', retencion:'/retencion?embed=1' };
let token=localStorage.getItem('domma_analytics_token');

// Pestañas permitidas por rol. 'admin' = todas. 'retencion' (equipo comercial/ayuda) = solo
// Gestión suscripciones + Acciones retención. La seguridad REAL está en los workers (cada
// endpoint valida el rol del JWT); esto es la capa de UI.
const ROLE_VIEWS = { retencion: ['bajas','retencion'] };
function aplicarPermisos(){
  const role = localStorage.getItem('domma_role') || 'admin';
  const allowed = ROLE_VIEWS[role]; // undefined para admin → todas
  document.querySelectorAll('.sb-item').forEach(b=>{
    const v = b.getAttribute('data-view');
    b.style.display = (!allowed || allowed.includes(v)) ? '' : 'none';
  });
  return allowed ? allowed[0] : 'metrics';
}
function showApp(){
  document.getElementById('loginOverlay').style.display='none';
  document.getElementById('app').style.display='flex';
  const first = aplicarPermisos();
  document.querySelectorAll('.sb-item').forEach(b=>b.classList.remove('active'));
  const btn = document.querySelector('.sb-item[data-view="'+first+'"]');
  if(btn) btn.classList.add('active');
  load(first);
}
function load(view){
  document.getElementById('content').src=VIEWS[view];
}
function nav(view,el){
  document.querySelectorAll('.sb-item').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  load(view);
}
function doLogin(){
  const email=document.getElementById('loginEmail').value;
  const pass=document.getElementById('loginPass').value;
  const errEl=document.getElementById('loginError');
  errEl.style.display='none';
  fetch(AUTH_API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})})
    .then(r=>r.json()).then(d=>{
      const role=d.role||(d.user&&d.user.role);
      if(d.token&&(role==='admin'||role==='retencion')){
        token=d.token;
        localStorage.setItem('domma_analytics_token',token);
        localStorage.setItem('domma_role',role);
        showApp();
      }else if(d.token){
        errEl.textContent='No tienes acceso a este panel';errEl.style.display='block';
      }else{
        errEl.textContent=d.error||'Credenciales incorrectas';errEl.style.display='block';
      }
    }).catch(()=>{errEl.textContent='Error de conexión';errEl.style.display='block';});
}
function logout(){localStorage.removeItem('domma_analytics_token');localStorage.removeItem('domma_role');location.reload();}

if(token){ showApp(); }
document.getElementById('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script>

</body>
</html>
