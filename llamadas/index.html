<!-- DOMMA · Estación de llamadas (Carme/Vale) — a quién llamar + registrar + motivador propio -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>DOMMA · A quién llamo</title>
<style>
  :root{
    --ground:#F8F7F5; --card:#FFFFFF; --indigo:#1C296A; --indigo-2:#2C3A85;
    --ink:#141a34; --muted:#6A6E85; --line:#ECE8E0;
    --green:#1F9D6B; --green-bg:#E7F5EF; --amber:#C0820A; --amber-bg:#FBF1DC;
    --red:#C0453B; --red-bg:#FBE9E7;
    font-synthesis:none;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ground);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1200px;margin:0 auto;padding:24px 20px 80px}
  html.embed .wrap{padding-top:20px}
  .head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .hi{font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
  .hi span{color:var(--indigo)}
  .who{display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--muted);font-weight:600;flex-wrap:wrap;justify-content:flex-end}
  .soy{display:flex;align-items:center;gap:6px}
  .who select{padding:6px 9px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px;color:var(--indigo);background:#fff;font-weight:700}
  .who a{color:var(--muted);font-size:12px;text-decoration:none}
  .who a:hover{color:var(--indigo)}

  /* Hero: lo más importante (a quién llamar / cuántas quedan), arriba y grande */
  .hero{margin-bottom:14px}
  .hero-lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
  .hero-n{font-size:30px;font-weight:800;color:var(--indigo);letter-spacing:-.02em;margin:3px 0 10px;font-variant-numeric:tabular-nums}
  /* Motivador compacto: una tira */
  .moti{background:linear-gradient(135deg,#1C296A 0%,#39308A 100%);border-radius:14px;padding:11px 18px;color:#fff;display:flex;align-items:center;gap:20px;flex-wrap:wrap;box-shadow:0 6px 18px rgba(28,41,106,.16);margin-bottom:16px}
  .moti-t{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;opacity:.72}
  .mstat{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
  .mstat b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;display:inline-block;transition:transform .35s cubic-bezier(.2,1.4,.4,1)}
  .mstat b.pop{transform:scale(1.4)}
  .streak{font-size:12.5px;font-weight:600;opacity:.9;margin-left:auto}
  .fil{display:flex;gap:8px;flex-wrap:wrap}
  .filbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 2px 14px}
  .chipf{font-size:12.5px;padding:6px 13px;border:1.5px solid var(--line);border-radius:20px;background:#fff;cursor:pointer;color:var(--muted);font-weight:700}
  .chipf.on{border-color:var(--indigo);color:var(--indigo);background:#F1F2FA}
  /* Barra de progreso del día */
  .prog{margin:0 2px 14px}
  .prog-bar{height:9px;background:#E7E3DB;border-radius:6px;overflow:hidden}
  .prog-fill{height:100%;background:linear-gradient(90deg,var(--green),#37b083);border-radius:6px;transition:width .5s ease}
  .prog-txt{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:6px}
  .prog-txt b{color:var(--ink);font-variant-numeric:tabular-nums}
  /* Fila de filtro por día */
  .filrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-left:auto}
  .buscador{flex:1 1 100%;padding:11px 15px;border:1.5px solid var(--line);border-radius:12px;font-size:14.5px;font-family:inherit;outline:none;background:#fff;color:var(--ink)}
  .buscador:focus{border-color:var(--indigo)}
  .buscador::placeholder{color:var(--muted)}
  .datelbl{font-size:12.5px;font-weight:700;color:var(--muted)}
  #dateFil{padding:7px 10px;border:1.5px solid var(--line);border-radius:9px;font-family:inherit;font-size:13px;color:var(--ink);background:#fff}
  /* Desktop: columnas anchas → menos scroll y la fila de acciones cabe en una línea */
  @media(min-width:820px){
    #list{display:grid;grid-template-columns:repeat(auto-fill,minmax(540px,1fr));gap:14px;align-items:start}
    #list .card{margin-bottom:0}
    #list .empty{grid-column:1/-1}
    .actions{flex-wrap:nowrap}          /* en ancho no se parten los botones → tarjeta más baja */
    .b-manage{margin-left:auto}
  }

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px;display:flex;box-shadow:0 2px 10px rgba(20,26,52,.04)}
  .stripe{width:7px;flex:none;background:var(--amber)}
  .card[data-state="green"] .stripe{background:var(--green)}
  .card[data-state="red"] .stripe{background:var(--red)}
  .body{flex:1;padding:13px 16px;min-width:0}
  .ctop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .cname{font-size:16px;font-weight:800;letter-spacing:-.01em}
  .cname a{color:var(--indigo);text-decoration:none;border-bottom:1px solid transparent}
  .cname a:hover{border-color:var(--indigo)}
  .cwhy{font-size:13px;color:var(--muted);margin-top:2px;font-weight:600}
  .cmeta-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:6px;flex-wrap:wrap}
  .cmeta{font-size:12.5px;color:var(--muted);word-break:break-word;flex:1;min-width:0}
  .cmeta b{color:var(--ink);font-weight:600}
  .histlink{font-size:12.5px;font-weight:700;color:var(--indigo);text-decoration:none;white-space:nowrap;cursor:pointer}
  .histlink:hover{text-decoration:underline}
  .b.dis{background:#F3F1EC;color:#B4B2AB;border:1.5px solid var(--line);cursor:not-allowed;pointer-events:none;font-weight:600;font-size:12px;padding:6px 10px}
  .chip{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:20px;white-space:nowrap;flex:none}
  .chip.amber{background:var(--amber-bg);color:var(--amber)} .chip.green{background:var(--green-bg);color:var(--green)} .chip.red{background:var(--red-bg);color:var(--red)}

  .hist{margin-top:11px;padding:10px 12px;background:#FAF8F4;border:1px solid var(--line);border-radius:11px}
  .hist-t{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
  .hline{font-size:12.5px;margin-bottom:5px;line-height:1.35}
  .hpill{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:20px;background:#EDEEF4;color:var(--indigo)}
  .hpill.green{background:var(--green-bg);color:var(--green)} .hpill.red{background:var(--red-bg);color:var(--red)} .hpill.amber{background:var(--amber-bg);color:var(--amber)}
  .hmeta{color:var(--muted)} .hnota{color:var(--ink);margin-top:1px}

  .actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
  .b{border:none;border-radius:8px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;padding:7px 11px;line-height:1}
  /* Acción principal de contacto */
  .b-call{background:var(--green);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
  .b-call:hover{filter:brightness(1.04)}
  /* Contacto secundario: ligero, discreto */
  .b-wa,.b-email{background:#fff;color:var(--muted);border:1.5px solid var(--line);text-decoration:none;display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:12px;padding:6px 10px}
  .b-wa:hover,.b-email:hover{border-color:var(--indigo);color:var(--indigo)}
  /* Acción principal de la tarjeta */
  .b-manage{background:var(--indigo);color:#fff;margin-left:auto}
  .b-manage:hover{background:var(--indigo-2)}

  .dispo{margin-top:15px;padding-top:13px;border-top:1px dashed var(--line)}
  .dispo-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .dispo-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .dispo-close{border:2px solid var(--line);background:#fff;color:var(--muted);font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer;padding:8px 14px;border-radius:10px}
  .dispo-close:hover{border-color:var(--red);color:var(--red)}
  .dispo-q{font-size:14px;font-weight:800;margin-bottom:10px}
  .seg{display:flex;gap:9px;margin-bottom:12px}
  .segb{flex:1;padding:12px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:14.5px;font-weight:800;color:var(--indigo);cursor:pointer;font-family:inherit}
  .segb.on{border-color:var(--indigo);background:#F1F2FA}
  .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .d{border:2px solid var(--line);background:#fff;border-radius:12px;font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;padding:13px 12px;text-align:left;color:var(--ink)}
  .d:hover{border-color:var(--indigo)} .d.win:hover{border-color:var(--green)} .d.bad{color:var(--red)} .d.bad:hover{border-color:var(--red)}
  .d.full{grid-column:1/-1}
  .nota{width:100%;margin-top:9px;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;font-family:inherit;font-size:13.5px;resize:vertical;box-sizing:border-box}
  .msg{font-size:13px;font-weight:700;margin-top:8px}
  .done{margin-top:13px;padding:13px 15px;background:var(--green-bg);border-radius:12px;font-size:15.5px;font-weight:800;color:var(--green)}
  .card[data-state="red"] .done{background:var(--red-bg);color:var(--red)}
  .card[data-state="amber"] .done{background:var(--amber-bg);color:var(--amber)}

  .empty{padding:30px;text-align:center;color:var(--muted);font-weight:600}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
  .foot{text-align:center;font-size:12px;color:var(--muted);margin-top:24px}

  .overlay{position:fixed;inset:0;background:var(--indigo);display:flex;align-items:center;justify-content:center;z-index:100}
  .login{background:#fff;border-radius:16px;padding:32px 28px;width:340px;text-align:center;box-shadow:0 16px 50px rgba(0,0,0,.25)}
  .login h1{font-size:20px;margin:0 0 4px;color:var(--indigo)} .login p{font-size:13px;color:var(--muted);margin:0 0 18px}
  .login input{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;margin-bottom:10px;font-size:14px;font-family:inherit;outline:none}
  .login .b{width:100%;background:var(--indigo);color:#fff}
  .err{color:var(--red);font-size:12.5px;margin-top:8px;min-height:15px}
  html.embed .head .who a{display:none}
  @media (prefers-reduced-motion:reduce){ .tile .n{transition:none} }
  @media (max-width:430px){ .dgrid{grid-template-columns:1fr} .tile .n{font-size:27px} }
</style>

<canvas id="confetti"></canvas>

<div class="overlay" id="overlay">
  <div class="login">
    <h1>A quién llamo</h1>
    <p>Entra con tu cuenta DOMMA</p>
    <input id="le" type="email" placeholder="email" autocomplete="username">
    <input id="lp" type="password" placeholder="contraseña" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <button class="b" onclick="login()">Acceder</button>
    <div class="err" id="lerr"></div>
  </div>
</div>

<div class="wrap" id="app" style="display:none">
  <div class="head">
    <div class="hi">Hola, <span id="agName">Carme</span> 👋</div>
    <div class="who">
      <span id="today"></span>
      <span class="soy">Soy: <select id="agSel" onchange="setAg(this.value)"></select></span>
      <a href="#" onclick="logout();return false">salir</a>
    </div>
  </div>

  <!-- Lo más importante, arriba y grande: a quién llamar y cuántas quedan -->
  <div class="hero">
    <div class="hero-lbl">A quién llamar hoy</div>
    <div class="hero-n" id="left">…</div>
    <div id="progreso"></div>
  </div>

  <!-- Motivador compacto (una tira) -->
  <div class="moti">
    <span class="moti-t">Hoy has conseguido</span>
    <span class="mstat">💚 <b id="n-reten">0</b> retenidas</span>
    <span class="mstat">🚀 <b id="n-cross">0</b> ventas cruzadas</span>
    <span class="mstat">⬆️ <b id="n-upsell">0</b> upsells</span>
    <span class="streak" id="streak">cada llamada cuenta 💪</span>
  </div>

  <div class="filbar">
    <input type="search" id="buscador" class="buscador" placeholder="🔍 Buscar clienta por nombre, email o teléfono…" oninput="setBusca(this.value)" autocomplete="off">
    <div class="fil" id="filtros"></div>
    <div class="filrow">
      <label class="datelbl">📅 Ver un día:</label>
      <input type="date" id="dateFil" onchange="setFecha(this.value)">
      <button class="chipf" id="dateClear" style="display:none" onclick="setFecha('')">✕ todos</button>
    </div>
  </div>
  <div id="list"><div class="empty">Cargando…</div></div>

  <div class="foot">Panel interno DOMMA · no compartir enlaces (datos de clientas)</div>
</div>

<script>
const API_BAJAS='https://domma-bajas.cristina-ed1.workers.dev';
const API_TODAY='https://gestorsubs-domma.cristina-ed1.workers.dev/today';  // fallos activos reales (cifra fiable = /metrics)
const API_TOQUES='https://luna-agent.cristina-ed1.workers.dev/api/metrics/fallo-pago-toques';  // toques WhatsApp por teléfono (D1 LUNA)
const METRICS_TOKEN='ae054e9b8acb290020c6be1d0839832ef34145dfe5ea3acc';
const API_TEL='https://gestorsubs-domma.cristina-ed1.workers.dev/telefonos-shopify';  // rellena el móvil que falta desde Shopify
const AUTH_API='https://domma-pro-api.cristina-ed1.workers.dev';
const SHOP_ADMIN='https://admin.shopify.com/store/wearedomma', APPSTLE_APP='subscription-by-rhem';
const AGENTES=['Carme','Vale','Ana','Marta'];
const WINS={retenida:'💚 Retenida', venta_cruzada:'🚀 Venta cruzada', upsell:'⬆️ Upsell'};
const RES_LABEL={retenida:'Retenida',cambio_producto:'Cambio de producto',cambio_fecha:'Cambio de fecha',venta_cruzada:'Venta cruzada',upsell:'Upsell',pausa:'Pausa',cancelado:'Cancelado',cancelar:'Cancelar',pendiente:'Volver a llamar',no_contesta:'No contesta',
  cobro_manual:'Cobro manual',actualizar_pago:'Actualizar el pago',pendiente_cobro:'Pendiente de cobro',cancelar_final:'Cancelar finalmente',cancelar_definitivo:'Cancelar definitivamente'};
const RES_TONE={retenida:'green',cambio_producto:'green',cambio_fecha:'green',venta_cruzada:'green',upsell:'green',pausa:'green',pendiente:'amber',no_contesta:'amber',cancelado:'red',cancelar:'red',
  cobro_manual:'green',actualizar_pago:'green',pendiente_cobro:'amber',cancelar_final:'red',cancelar_definitivo:'red'};

if(new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('embed');
(function(){ const m=location.hash.match(/token=([^&]+)/); if(m){ localStorage.setItem('domma_analytics_token',decodeURIComponent(m[1])); history.replaceState(null,'',location.pathname); } })();
let token=localStorage.getItem('domma_analytics_token')||'';
let LISTA=[], GEST={byC:{},byCust:{}}, GALL=[], filtro='todas', fechaFil='', busca='';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoyISO=()=>new Date().toISOString().slice(0,10);
const nid=v=>String(v==null?'':v).split('.')[0].trim();

function login(){
  const email=(document.getElementById('le').value||'').trim(), pass=document.getElementById('lp').value||'';
  const err=document.getElementById('lerr'); err.textContent='';
  fetch(AUTH_API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})})
    .then(r=>r.json()).then(d=>{
      const role=d.role||(d.user&&d.user.role);
      if(d.token&&(role==='admin'||role==='retencion')){ token=d.token; localStorage.setItem('domma_analytics_token',token); arrancar(); }
      else err.textContent='No autorizado';
    }).catch(()=>err.textContent='No se pudo conectar');
}
function logout(){ localStorage.removeItem('domma_analytics_token'); location.reload(); }
function agActual(){ return localStorage.getItem('domma_agente')||'Carme'; }
function setAg(v){ localStorage.setItem('domma_agente',v); document.getElementById('agName').textContent=v; document.getElementById('agSel').value=v; motivador(); }

function arrancar(){
  document.getElementById('overlay').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('today').textContent=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  const ag=agActual();
  document.getElementById('agSel').innerHTML=AGENTES.map(a=>`<option${a===ag?' selected':''}>${a}</option>`).join('');
  document.getElementById('agName').textContent=ag;
  cargar();
}

const labelMotivo=m=>({gate_2pedidos:'Menos de 2 pedidos',min_2_pedidos:'Menos de 2 pedidos',min_permanencia:'Aún sin permanencia',fallo_pago:'Fallo de pago',coach:'Derivada a Ana'}[m]||m||'—');
function porQue(s){ const CM={min_2_pedidos:'Menos de 2 pedidos',min_permanencia:'Aún sin permanencia',fallo_pago:'Tiene un fallo de pago'}; const c=(s.comentario||'').trim(); return CM[c]||(c&&c.length<=60?c:'')||labelMotivo(s.motivo)||'Derivada a Ana'; }

async function cargar(){
  const H={'Content-Type':'application/json','Authorization':'Bearer '+token};
  let bajas={}, hoyFallos={}, gest={}, toq={};
  try{
    const [rb,rf,rg,rt]=await Promise.all([
      fetch(API_BAJAS+'/api/dashboard',{method:'POST',headers:H,body:JSON.stringify({incluir_test:false})}).then(r=>r.json()),
      fetch(API_TODAY).then(r=>r.json()).catch(()=>({})),   // fallos ACTIVOS reales de Appstle (sin el bug de fechas de /failures-since)
      fetch(API_BAJAS+'/api/dashboard/gestiones',{method:'POST',headers:H,body:JSON.stringify({limit:500})}).then(r=>r.json()),
      fetch(API_TOQUES+'?token='+METRICS_TOKEN).then(r=>r.json()).catch(()=>({})),   // toques WhatsApp por teléfono
    ]);
    bajas=rb||{}; hoyFallos=rf||{}; gest=rg||{}; toq=rt||{};
  }catch(e){ document.getElementById('list').innerHTML='<div class="empty">No se pudo cargar. Recarga la página.</div>'; return; }
  if(bajas.error==='no_autorizado'){ logout(); return; }

  // Historial de gestiones (para contexto/notas + motivador)
  GALL=(gest.gestiones||[]); GEST={byC:{},byCust:{}};
  GALL.forEach(g=>{ const c=nid(g.contract_id), cu=String(g.customer_id||''); if(c){(GEST.byC[c]=GEST.byC[c]||[]).push(g);} if(cu){(GEST.byCust[cu]=GEST.byCust[cu]||[]).push(g);} });

  const sol=(bajas.solicitudes&&bajas.solicitudes.pendientes)||[];
  const der=bajas.derivadas||[];
  // Fallos de pago: TODOS (activos que Appstle reintenta + backlog dunning agotado).
  // Decisión Cristina: llamar a todos. Marcamos el backlog como "sin reintentos".
  const impEur=a=>{ const n=parseFloat(String(a||'').replace(/[^\d.,-]/g,'').replace(',','.'))||0; return n?' · '+n.toFixed(2).replace('.',',')+' €':''; };
  const diasDe=fd=>{ fd=(fd||'').slice(0,10); return fd?Math.floor((Date.now()-Date.parse(fd))/864e5):null; };
  // Toques de WhatsApp por teléfono (últimos 9 dígitos), desde el D1 de LUNA.
  const TOQ=toq.toques||{};
  const n9=p=>{ const d=String(p||'').replace(/\D/g,''); return d.length>9?d.slice(-9):d; };
  const mkFallo=(f,backlog)=>{
    const tel=String(f.phone||'').replace(/\D/g,''); const wa=TOQ[n9(f.phone)]||null; const dias=diasDe(f.fail_date);
    return {tipo:'fallo', backlog:!!backlog, nombre:(f.name||'').trim(), email:(f.email||'').trim(), phone:(f.phone||'').trim(),
      customer_id:'', contract_id:f.contract_id, dias, fecha:(f.fail_date||'').slice(0,10),
      importe: parseFloat(String(f.amount||'').replace(/[^\d.,-]/g,'').replace(',','.'))||null,
      wa: wa?{toque:wa.toque_max, ultimo:(wa.ultimo||'').slice(0,10)}:null, hasTel:!!tel,
      why:'Fallo de pago'+(backlog?' · sin reintentos':'')+impEur(f.amount)+(wa?` · 💬 WhatsApp toque ${wa.toque_max}`:'')};
  };
  // GATE exacto por toques reales de WhatsApp: Carme llama cuando la secuencia ya hizo su
  // trabajo → (≥2 toques) O (sin teléfono, WhatsApp no llega) O (≥5 días, ya pasó toda la
  // secuencia). Espera solo si el WhatsApp está trabajando (tiene tel, <2 toques, <5 días).
  const fa=[...(hoyFallos.failed||[]).map(f=>mkFallo(f,false)), ...(hoyFallos.dunning_skipped||[]).map(f=>mkFallo(f,true))]
    .filter(f=> ((f.wa&&f.wa.toque>=2)) || !f.hasTel || (f.dias!=null && f.dias>=5) );

  // Worklist persistente: guardamos los fallos que se muestran para que NO desaparezcan al
  // pagar la clienta (sale de /today) antes de que Carma registre la gestión. La worklist
  // devuelve también los que ya pagaron y faltan por registrar → se muestran «✅ ya pagó».
  const mkFalloResuelto=row=>{ const tel=String(row.phone||'').replace(/\D/g,'');
    return {tipo:'fallo', backlog:!!row.backlog, resuelto:true, nombre:(row.nombre||'').trim(), email:(row.email||'').trim(),
      phone:(row.phone||'').trim(), customer_id:String(row.customer_id||''), contract_id:row.contract_id,
      dias:diasDe(row.fail_date), fecha:(row.fail_date||'').slice(0,10), wa:null, hasTel:!!tel,
      why:'✅ Ya pagó — registra cómo lo gestionaste'+(row.importe?' · '+Number(row.importe).toFixed(2).replace('.',',')+' €':'')};
  };
  let resueltas=[];
  try{
    const payload=fa.map(f=>({contract_id:f.contract_id, customer_id:f.customer_id, nombre:f.nombre, email:f.email, phone:f.phone, importe:f.importe, fail_date:f.fecha, backlog:f.backlog}));
    const wr=await fetch(API_BAJAS+'/api/dashboard/fallos-sync',{method:'POST',headers:H,body:JSON.stringify({fallos:payload})}).then(r=>r.json());
    const liveIds=new Set([...(hoyFallos.failed||[]), ...(hoyFallos.dunning_skipped||[])].map(f=>nid(f.contract_id)));
    resueltas=(wr.worklist||[]).filter(row=>!liveIds.has(nid(row.contract_id))).map(mkFalloResuelto);
  }catch(e){}

  LISTA=[
    ...sol.map(s=>({tipo:'baja', nombre:s.nombre, email:s.email, phone:s.phone, customer_id:s.customer_id, contract_id:s.contrato, why:labelMotivo(s.motivo), dias:s.dias, alerta:s.fuera_de_plazo, fecha:(s.fecha||'').slice(0,10)})),
    ...der.map(s=>({tipo:'derivada', nombre:s.nombre, email:s.email, phone:s.phone, customer_id:s.customer_id, contract_id:s.contrato, why:porQue(s), dias:s.dias, fecha:(s.fecha||'').slice(0,10)})),
    ...fa,
    ...resueltas,
  ];
  motivador();
  render();
  enriquecerTelefonos();   // en segundo plano: rellena el móvil que falta (Appstle no lo trae) desde Shopify
}

// Muchas clientas no traen móvil desde Appstle, pero Shopify sí (cacheado en KV). Rellenamos
// los que faltan para que Llamar/WhatsApp queden operativos, y re-pintamos.
async function enriquecerTelefonos(){
  const faltan=LISTA.filter(c=>!String(c.phone||'').replace(/\D/g,'') && c.email);
  if(!faltan.length) return;
  const emails=[...new Set(faltan.map(c=>c.email))].slice(0,80);
  try{
    const r=await fetch(API_TEL+'?'+new URLSearchParams({emails:emails.join(','), max:'80'}));
    const d=await r.json(); const tel=d.telefonos||{};
    let cambios=false;
    LISTA.forEach(c=>{ if(!String(c.phone||'').replace(/\D/g,'') && c.email && tel[c.email]){ c.phone=tel[c.email]; c.telShopify=true; cambios=true; } });
    if(cambios) render();
  }catch(e){}
}

function histDe(caso){ const c=nid(caso.contract_id); const cu=String(caso.customer_id||''); return (c&&GEST.byC[c])||(cu&&GEST.byCust[cu])||[]; }
// Resultados que "cierran" el caso por hoy. Los no terminales (volver a llamar / no contesta)
// mantienen la clienta en la lista, porque hay que reintentarla.
const TERMINAL=new Set(['retenida','cambio_producto','cambio_fecha','venta_cruzada','upsell','pausa','cancelado','cancelar','cobro_manual','actualizar_pago','pendiente_cobro','cancelar_final','cancelar_definitivo']);
function gestionadaHoy(caso){ return histDe(caso).some(g=>String(g.created_at||'').slice(0,10)===hoyISO() && TERMINAL.has(g.resultado)); }
const fechaCorta=s=>{ if(!s)return''; const d=new Date(String(s).replace(' ','T')+'Z'); return isNaN(d)?esc(s):d.toLocaleDateString('es-ES',{day:'2-digit',month:'short'}); };
function histInner(caso){
  const h=histDe(caso); if(!h.length) return '';
  return h.slice(0,6).map(g=>`<div class="hline"><span class="hpill ${RES_TONE[g.resultado]||''}">${esc(RES_LABEL[g.resultado]||g.resultado)}</span> <span class="hmeta">${g.contacto==='no_localizada'?'no localizada':'localizada'}${g.agente?' · '+esc(g.agente):''} · ${fechaCorta(g.created_at)}</span>${g.nota?`<div class="hnota">${esc(g.nota)}</div>`:''}</div>`).join('');
}

// Clientas con las que YA se ha hablado (de las gestiones registradas): para reencontrar a
// alguien aunque su caso ya no esté en la lista. Una tarjeta por clienta (la gestión más
// reciente), localizada o no. GALL viene ORDER BY created_at DESC → la 1ª por clienta es la última.
function gestionadasCards(){
  const seen=new Set(), out=[];
  for(const g of GALL){
    if(g.es_test) continue;
    const key=nid(g.contract_id)||String(g.customer_id||'')||(g.email||'').toLowerCase();
    if(!key||seen.has(key)) continue; seen.add(key);
    const t=g.tipo_caso==='fallo_pago'?'fallo':(g.tipo_caso==='baja'?'baja':'derivada');
    const loc=g.contacto==='no_localizada'?'No localizada':'Localizada';
    const res=RES_LABEL[g.resultado]||g.resultado||'';
    out.push({tipo:t, gestionada:true, nombre:g.nombre, email:g.email, phone:g.phone,
      customer_id:g.customer_id, contract_id:g.contract_id, fecha:(g.created_at||'').slice(0,10),
      why:`${loc}${res?' · '+res:''}${g.agente?' · '+g.agente:''} · ${fechaCorta(g.created_at)}`});
  }
  return out;
}

let VIS=[];   // lista exacta que se está pintando (índice de las tarjetas → esta lista)
function render(){
  const gestHoy=LISTA.filter(gestionadaHoy).length;                 // ya gestionadas hoy (terminal)
  let vivas=LISTA.filter(c=>!gestionadaHoy(c));                     // desaparecen del día
  if(fechaFil) vivas=vivas.filter(c=>c.fecha===fechaFil);          // filtro por día (calendario)
  // Barra de progreso del día → da sensación de "hay un final"
  const totalDia=gestHoy+vivas.length, pct=totalDia?Math.round(gestHoy/totalDia*100):0;
  document.getElementById('progreso').innerHTML = totalDia
    ? `<div class="prog"><div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div><div class="prog-txt"><b>${gestHoy}</b> gestionada${gestHoy===1?'':'s'} hoy · quedan <b>${vivas.length}</b></div></div>` : '';
  const gestList = fechaFil ? gestionadasCards().filter(c=>c.fecha===fechaFil) : gestionadasCards();
  const counts={todas:vivas.length, baja:vivas.filter(x=>x.tipo==='baja').length, derivada:vivas.filter(x=>x.tipo==='derivada').length, fallo:vivas.filter(x=>x.tipo==='fallo').length, gestionadas:gestList.length};
  const defs=[['todas','Todas'],['baja','Bajas'],['derivada','Derivadas'],['fallo','Fallos de pago'],['gestionadas','✓ Ya habladas']];
  document.getElementById('filtros').innerHTML=defs.map(([k,l])=>`<span class="chipf ${filtro===k?'on':''}" onclick="setFiltro('${k}')">${l} <b>${counts[k]||0}</b></span>`).join('');
  document.getElementById('dateClear').style.display=fechaFil?'inline-block':'none';
  // Búsqueda: encuentra a CUALQUIERA — pendientes de llamar Y ya habladas (aunque su caso ya no
  // esté en la lista). Sin búsqueda: respeta el chip (incluido «✓ Ya habladas»).
  const matchB=c=>((c.nombre||'')+' '+(c.email||'')+' '+(c.phone||'')).toLowerCase().includes(busca);
  if(busca){
    const seen=new Set(); VIS=[];
    for(const c of [...vivas, ...gestList]){ const k=nid(c.contract_id)||String(c.customer_id||'')||(c.email||''); if(seen.has(k)) continue; seen.add(k); if(matchB(c)) VIS.push(c); }
  } else if(filtro==='gestionadas'){ VIS=gestList; }
  else { VIS = filtro==='todas' ? vivas : vivas.filter(x=>x.tipo===filtro); }
  document.getElementById('left').textContent = busca ? `${VIS.length} resultado${VIS.length===1?'':'s'}`
    : filtro==='gestionadas' ? `${VIS.length} ya hablada${VIS.length===1?'':'s'}` : (VIS.length? `${VIS.length} por llamar` : (fechaFil?'nada ese día 👌':'¡todo llamado! 🎉'));
  document.getElementById('list').innerHTML = VIS.length ? VIS.map((c,i)=>tarjeta(c,i)).join('') : `<div class="empty">${busca?'Ninguna clienta coincide con «'+esc(busca)+'».':(filtro==='gestionadas'?'Aún no hay clientas gestionadas.':'Nada por llamar aquí. 👌')}</div>`;
}
function setBusca(v){ busca=(v||'').toLowerCase().trim(); render(); }
function setFiltro(k){ filtro=k; render(); }
function setFecha(v){ fechaFil=v||''; const el=document.getElementById('dateFil'); if(el) el.value=fechaFil; render(); }

function tarjeta(c,i){
  const tel=(c.phone||'').replace(/\D/g,''); const telH=tel?('tel:+'+(tel.length===9?'34'+tel:tel)):'';
  const chip = c.resuelto?'<span class="chip green">✅ Ya pagó</span>':c.gestionada?`<span class="chip green">✓ Ya hablada</span>`:c.tipo==='fallo'?'<span class="chip red">Fallo de pago</span>':c.tipo==='derivada'?'<span class="chip amber">Derivada</span>':'<span class="chip amber">Baja</span>';
  const nombre = c.nombre? (c.contract_id?`<a href="#" onclick="verSub('${esc(c.customer_id)}','${esc(c.contract_id)}');return false">${esc(c.nombre)}</a>`:esc(c.nombre)) : (c.email?esc(c.email):'Sin nombre');
  const nHist=histDe(c).length;
  const meta=(c.email?`✉️ <b>${esc(c.email)}</b>`:'')+(c.email&&c.phone?' · ':'')+(c.phone?`📱 <b>${esc(c.phone)}</b>`:'')+((!c.email&&!c.phone)?'<span style="color:var(--amber)">sin contacto — abre su ficha</span>':'');
  return `<div class="card" data-state="${(c.resuelto||c.gestionada)?'green':'amber'}" id="c${i}">
    <div class="stripe"></div>
    <div class="body">
      <div class="ctop"><div><div class="cname">${nombre}</div><div class="cwhy">${esc(c.why)}${c.alerta?' · <b style="color:var(--red)">pasa de 72h</b>':''}</div></div>${chip}</div>
      <div class="cmeta-row"><span class="cmeta">${meta}</span>${nHist?`<a class="histlink" href="#" data-n="${nHist}" onclick="toggleHist(${i},this);return false">Ver historial · ${nHist}</a>`:''}</div>
      <div class="hist" id="hist${i}" hidden>${histInner(c)}</div>
      <div class="actions">
        ${tel?`<button class="b b-call" onclick="llamar('${esc(c.phone)}',this)">📞 Llamar</button>`:`<span class="b b-call dis" title="No tenemos su teléfono">📞 Llamar</span>`}
        ${tel?`<a class="b b-wa" href="#" onclick="wati('${esc(c.phone)}');return false">💬 WhatsApp</a>`:`<span class="b b-wa dis" title="No tenemos su teléfono">💬 WhatsApp</span>`}
        ${c.email?`<a class="b b-email" href="mailto:${esc(c.email)}">✉️ Email</a>`:`<span class="b b-email dis" title="No tenemos su email">✉️ Email</span>`}
        <button class="b b-manage" onclick="reveal(${i})">Registrar</button>
      </div>
      <div class="dispo" id="d${i}" hidden></div>
      <div class="done" id="done${i}" hidden></div>
    </div></div>`;
}
function toggleHist(i,el){ const d=document.getElementById('hist'+i); if(!d)return; d.hidden=!d.hidden; el.textContent=(d.hidden?'Ver':'Ocultar')+' historial · '+el.dataset.n; }
function reveal(i){
  const d=document.getElementById('d'+i);
  d.hidden=false; d.dataset.c='';
  d.innerHTML=`<div class="dispo-head"><span class="dispo-title">Registrar la llamada</span><button class="dispo-close" onclick="cerrar(${i})">✕ Cerrar</button></div>
    <div class="dispo-q">¿Has podido hablar con ella?</div>
    <div class="seg"><button class="segb" onclick="paso2(${i},'localizada',this)">Sí, localizada</button><button class="segb" onclick="paso2(${i},'no_localizada',this)">No localizada</button></div>
    <div id="res${i}"></div>`;
  d.scrollIntoView({block:'nearest'});
}
function cerrar(i){ const d=document.getElementById('d'+i); if(d){ d.hidden=true; d.innerHTML=''; } }
function paso2(i,contacto,btn){
  const caso=VIS[i];
  document.getElementById('d'+i).querySelectorAll('.segb').forEach(b=>b.classList.remove('on')); btn.classList.add('on');
  let botones;
  if(caso.tipo==='fallo'){
    // Disposición de FALLOS DE PAGO (spec de Carme)
    if(contacto==='no_localizada'){
      botones=[['cobro_manual','💳 Cobro manual',''],['cancelar_definitivo','❌ Cancelar definitivamente','full bad'],['pendiente','⏳ Pendiente · volver a intentar','full']];
    } else {
      botones=[['cobro_manual','💳 Cobro manual',''],['actualizar_pago','🔄 Actualizar el pago',''],['pendiente_cobro','📅 Pendiente de cobro',''],['cancelar_final','❌ Cancelar finalmente','full bad']];
    }
  } else {
    // Disposición de BAJAS y DERIVADAS (spec de Carme + Upsell)
    if(contacto==='no_localizada'){
      botones=[['pendiente','⏳ Pendiente · volver a llamar','full'],['cancelar','❌ Cancelar','full bad']];
    } else {
      botones=[['pausa','⏸️ Pausa',''],['cambio_producto','🔄 Cambio de producto',''],['cambio_fecha','📅 Cambio de fecha',''],['venta_cruzada','🚀 Venta cruzada','win'],['retenida','💚 Retenida','win'],['upsell','⬆️ Upsell','win'],['cancelado','❌ Cancelado','full bad']];
    }
  }
  document.getElementById('res'+i).innerHTML=
    `<div class="dgrid">${botones.map(([r,l,cls])=>`<button class="d ${cls}" onclick="guardar(${i},'${contacto}','${r}',this)">${l}</button>`).join('')}</div>
     <textarea class="nota" id="nota${i}" rows="2" placeholder="Nota (opcional): qué dijo, próximo paso…"></textarea>
     <div class="msg" id="msg${i}"></div>`;
}
async function guardar(i,contacto,resultado,btn){
  const caso=VIS[i];
  const msg=document.getElementById('msg'+i); msg.textContent='Guardando…'; msg.style.color='var(--muted)';
  document.querySelectorAll('#res'+i+' .d').forEach(b=>b.disabled=true);
  const body={tipo_caso:caso.tipo==='fallo'?'fallo_pago':'baja', customer_id:caso.customer_id||'', contract_id:caso.contract_id||'', nombre:caso.nombre||'', email:caso.email||'', phone:caso.phone||'', contacto, resultado, agente:agActual(), nota:(document.getElementById('nota'+i).value||'').trim()};
  try{
    const r=await fetch(API_BAJAS+'/api/dashboard/gestion',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(body)});
    const d=await r.json();
    if(!d||!d.ok){ msg.textContent='No se pudo guardar'; msg.style.color='var(--red)'; document.querySelectorAll('#res'+i+' .d').forEach(b=>b.disabled=false); return; }
    const g=d.gestion||{...body,created_at:hoyISO()};
    GALL.unshift(g);
    const c=nid(body.contract_id), cu=String(body.customer_id||'');
    if(c){(GEST.byC[c]=GEST.byC[c]||[]).unshift(g);} if(cu){(GEST.byCust[cu]=GEST.byCust[cu]||[]).unshift(g);}
    const card=document.getElementById('c'+i);
    const state = RES_TONE[resultado] || 'amber';
    card.dataset.state=state;
    card.querySelector('.dispo').hidden=true; card.querySelector('.actions').style.display='none';
    const done=document.getElementById('done'+i); done.hidden=false;
    done.textContent=(WINS[resultado]?'🎉 ':'')+(RES_LABEL[resultado]||resultado)+(WINS[resultado]?' · ¡bien hecho!':'');
    if(WINS[resultado]){ motivador(); celebrate(); }
    // Gestión terminal → la clienta sale de la lista del día (se desvanece). «Volver a
    // llamar» / «no contesta» NO son terminales: se quedan para reintentar.
    if(TERMINAL.has(resultado)){ card.style.transition='opacity .5s,transform .5s'; setTimeout(()=>{ card.style.opacity='0'; card.style.transform='translateX(12px)'; }, WINS[resultado]?1100:500); setTimeout(render, WINS[resultado]?1700:1050); }
  }catch(e){ msg.textContent='Error de conexión'; msg.style.color='var(--red)'; document.querySelectorAll('#res'+i+' .d').forEach(b=>b.disabled=false); }
}

function motivador(){
  const ag=agActual(), hoy=hoyISO();
  const mios=GALL.filter(g=>g.agente===ag && String(g.created_at||'').slice(0,10)===hoy);
  const n={retenida:0,venta_cruzada:0,upsell:0};
  mios.forEach(g=>{ if(n[g.resultado]!=null) n[g.resultado]++; });
  bump('n-reten',n.retenida); bump('n-cross',n.venta_cruzada); bump('n-upsell',n.upsell);
  const total=n.retenida+n.venta_cruzada+n.upsell;
  const frases=['Empieza el día — cada llamada cuenta 💪','¡Vas genial! Sigue así 💪','¡Imparable! 🔥','¡Qué crack! 🌟','¡El equipo lo nota 💜!'];
  document.getElementById('streak').textContent=frases[Math.min(total,frases.length-1)];
}
function bump(id,val){ const el=document.getElementById(id); if(el.textContent!=String(val)){ el.textContent=val; el.classList.add('pop'); setTimeout(()=>el.classList.remove('pop'),350);} }

function verSub(cid,ctr){ const c=ctr?nid(ctr):''; if(c){ window.open(SHOP_ADMIN+'/apps/'+APPSTLE_APP+'/dashboard/subscriptions/'+encodeURIComponent(c)+'/detail?details=true','_blank','noopener'); } else if(cid){ window.open(SHOP_ADMIN+'/customers/'+encodeURIComponent(cid),'_blank','noopener'); } }
// Ringover click-to-call: pide al worker que lance el callback. Suena la app de Ringover de la
// agente (sesión DOMMA) → contesta → Ringover marca a la clienta. No abre el marcador del móvil.
async function llamar(phone, btn){
  const orig=btn.textContent; btn.disabled=true; btn.textContent='📞 Sonando tu Ringover…';
  try{
    const r=await fetch(API_BAJAS+'/api/dashboard/ringover-call',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({phone})});
    const d=await r.json().catch(()=>({}));
    if(d && d.ok){ btn.textContent='📞 Contesta tu Ringover ✓'; }
    else { btn.textContent='⚠️ '+((d&&d.error)||'no se pudo'); }
  }catch(e){ btn.textContent='⚠️ sin conexión'; }
  setTimeout(()=>{ btn.textContent=orig; btn.disabled=false; }, 4500);
}
async function wati(phone){
  const tel=String(phone||'').replace(/\D/g,''); const w=window.open('about:blank','_blank');
  try{ const r=await fetch(API_BAJAS+'/api/dashboard/wati-link',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({phone:tel})}); const d=await r.json().catch(()=>({})); if(d&&d.url){ w.location=d.url; } else { w.location='https://wa.me/'+(tel.length===9?'34'+tel:tel); } }
  catch(e){ if(w) w.location='https://wa.me/'+(tel.length===9?'34'+tel:tel); }
}

/* Confeti */
const cv=document.getElementById('confetti'), cx=cv.getContext('2d');
function size(){ cv.width=innerWidth; cv.height=innerHeight; } size(); addEventListener('resize',size);
let parts=[]; const COLORS=['#1F9D6B','#EAA92B','#E8763E','#1C296A','#39308A'];
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function celebrate(){ if(reduce) return; const px=innerWidth/2, py=innerHeight*0.3;
  for(let k=0;k<110;k++){ const a=Math.random()*Math.PI*2, sp=4+Math.random()*8; parts.push({x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-4,g:.18+Math.random()*.12,s:5+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.5,c:COLORS[k%COLORS.length],life:60+Math.random()*40}); }
  if(parts.length<=110) loop();
}
function loop(){ cx.clearRect(0,0,cv.width,cv.height); parts.forEach(p=>{ p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--; cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore(); }); parts=parts.filter(p=>p.life>0&&p.y<cv.height+30); if(parts.length) requestAnimationFrame(loop); else cx.clearRect(0,0,cv.width,cv.height); }

if(token) arrancar();
</script>
