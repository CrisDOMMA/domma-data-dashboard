<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>DOMMA — Fallos de pago</title>
<style>
  :root{
    --navy:#1C296A; --navy-2:#2C3A85; --bg:#F8F7F5; --card:#fff;
    --border:#e6e6ea; --line:#EFEDE8; --muted:#6B6B6B; --track:#EFEDF0;
    --green:#1E7A5A; --amber:#B77B12; --red:#B23A3A;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--navy);font-size:14px}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 20px 60px}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand img{height:26px}
  h1{font-size:20px;font-weight:700}
  .tag{font-size:12px;color:var(--muted)}
  .btn{background:var(--navy);color:#fff;border:none;border-radius:9px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn:hover{background:var(--navy-2)}
  .btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--border)}
  .btn.ghost:hover{border-color:var(--navy)}
  .muted{color:var(--muted)}

  /* LOGIN */
  .overlay{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:999}
  .login{background:#fff;border-radius:16px;padding:36px;width:340px;max-width:90vw;text-align:center}
  .login img{height:26px;margin-bottom:16px}
  .login h2{font-size:19px;margin-bottom:4px}
  .login p{font-size:12.5px;color:var(--muted);margin-bottom:20px}
  .login input{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:8px;margin-bottom:10px;font-size:14px;font-family:inherit;outline:none}
  .login input:focus{border-color:var(--navy)}
  .err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:16px}

  .controls{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:18px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .field input,.field select{padding:8px 11px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:#fff}
  .field input:focus,.field select:focus{border-color:var(--navy)}
  .spacer{flex:1}
  .cmp-check{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
  .cmp-check input{width:14px;height:14px;accent-color:var(--navy);cursor:pointer}
  .cmp-wrap select:disabled{opacity:.45;cursor:not-allowed}

  /* Pestañas */
  .tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--border);margin-bottom:22px;flex-wrap:wrap}
  .tab{background:none;border:none;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;
    padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;
    display:flex;align-items:center;gap:7px}
  .tab:hover{color:var(--navy)}
  .tab.on{color:var(--navy);border-bottom-color:var(--navy)}
  .badge{background:var(--red);color:#fff;font-size:10.5px;font-weight:700;border-radius:20px;padding:1px 6px;min-width:17px;text-align:center}
  .badge.calm{background:var(--track);color:var(--muted)}

  /* Titular */
  .titular{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--navy);
    border-radius:12px;padding:16px 18px;margin-bottom:18px;font-size:14.5px;line-height:1.55}
  .titular .sub{font-size:12.5px;color:var(--muted);margin-top:6px}

  .sect{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:26px 0 10px}
  .sect:first-child{margin-top:0}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:15px 16px}
  .kpi .lab{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:7px}
  .kpi .val{font-size:27px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .kpi .sub{font-size:12px;color:var(--muted);margin-top:5px}
  .kpi.hero{background:linear-gradient(135deg,#1C296A,#2C3A85);border-color:#1C296A;color:#fff}
  .kpi.hero .lab,.kpi.hero .sub{color:#C9CEEA}
  .delta{font-size:12px;font-weight:650;margin-top:6px;display:inline-block}
  .up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--muted)}
  .kpi.hero .up{color:#8FE3BE} .kpi.hero .down{color:#FFB4AC} .kpi.hero .flat{color:#C9CEEA}

  /* Tarjetas de acción */
  .todo{display:grid;grid-template-columns:1fr;gap:12px}
  .act{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:15px 16px;
    cursor:pointer;text-align:left;font-family:inherit;color:inherit;transition:border-color .12s,box-shadow .12s;width:100%}
  .act:hover{border-color:var(--navy);box-shadow:0 2px 12px rgba(28,41,106,.07)}
  .act .lab{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:7px}
  .act .val{font-size:27px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .act .sub{font-size:12px;color:var(--muted);margin-top:5px}
  .act .go{font-size:12px;font-weight:650;color:var(--navy);margin-top:9px;display:block}
  .act.alert{border-color:#E9BFBA;background:#FEF7F6} .act.alert .val{color:var(--red)}
  .act.ok .val{color:var(--green)}

  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-top:12px}
  .card h3{font-size:14px;margin-bottom:3px}
  .card .hint{font-size:12.5px;color:var(--muted);margin-bottom:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;vertical-align:top}
  th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:600;white-space:nowrap;cursor:default}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#FCFBFA}
  td.num,th.num{text-align:right}
  .bar{height:7px;border-radius:4px;background:#EDEEF4;overflow:hidden;min-width:60px}
  .bar > i{display:block;height:100%;background:var(--navy);border-radius:4px}
  .avisos{background:#FCF3E0;border:1px solid #EAD9A8;color:#8A6206;font-size:12.5px;padding:12px 15px;border-radius:10px;margin-top:18px}
  .avisos ul{margin:6px 0 0 16px}
  .avisos li{margin-bottom:3px}
  .loading{text-align:center;color:var(--muted);padding:50px;font-size:13px}
  .foot{font-size:11.5px;color:var(--muted);margin-top:26px;text-align:center}

  /* Listado individual */
  .listbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
  .listbar input,.listbar select{padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:#fff}
  .listbar input:focus,.listbar select:focus{border-color:var(--navy)}
  .listbar .count{font-size:12.5px;color:var(--muted);margin-left:auto}
  .pill{display:inline-block;font-size:11px;font-weight:650;border-radius:20px;padding:2px 9px;white-space:nowrap}
  .pill.red{background:#FBE9E7;color:var(--red)}
  .pill.amber{background:#FBF1DD;color:var(--amber)}
  .pill.green{background:#E4F3EC;color:var(--green)}
  .pill.grey{background:var(--track);color:var(--muted)}
  .pill.navy{background:#E7EAF6;color:var(--navy)}
  .who{font-weight:600}
  .who.none{color:var(--muted);font-weight:400}
  .dias{font-weight:700}
  .dias.warn{color:var(--amber)} .dias.bad{color:var(--red)}
  .cli .em{font-size:11.5px;color:var(--muted);display:block}
  .acts a{color:var(--navy);text-decoration:none;font-weight:600;font-size:12.5px;margin-right:10px;white-space:nowrap}
  .acts a:hover{text-decoration:underline}
  /* ── CRM: clienta clicable + panel de gestión (disposición) ── */
  .cli-link{color:var(--navy);text-decoration:none;font-weight:700;border-bottom:1px solid transparent}
  .cli-link:hover{border-bottom-color:var(--navy)}
  .lg-badge{display:inline-block;margin-top:3px;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:20px;background:#EDEEF4;color:var(--navy)}
  .lg-badge.ok{background:#E7F5EF;color:var(--green)} .lg-badge.bad{background:#FBE9E7;color:var(--red)} .lg-badge.warn{background:#FCF3E0;color:var(--amber)}
  .gest-panel-row > td{background:#FBFAF8;padding:0}
  .gest-panel{padding:16px 18px;border-top:2px solid var(--navy);border-left:3px solid var(--navy)}
  .gest-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:12px;flex-wrap:wrap}
  .gest-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .gest-ag{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);display:flex;gap:6px;align-items:center}
  .gest-ag select{padding:5px 8px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;font-family:inherit;text-transform:none;letter-spacing:normal;color:var(--navy);background:#fff}
  .dispo-grp{display:flex;align-items:center;gap:10px;margin:7px 0;flex-wrap:wrap}
  .dispo-lab{font-size:11px;font-weight:700;color:var(--muted);min-width:96px;display:flex;align-items:center}
  .dispo-lab::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px}
  .dispo-grp.loc .dispo-lab::before{background:var(--green)}
  .dispo-grp.noloc .dispo-lab::before{background:#B9BCCB}
  .dispo-chips{display:flex;gap:7px;flex-wrap:wrap}
  .dispo-chip{background:#fff;border:1.5px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--navy);cursor:pointer;font-family:inherit}
  .dispo-chip:hover{border-color:var(--navy)}
  .dispo-chip.sel{background:var(--navy);border-color:var(--navy);color:#fff}
  .gest-nota{width:100%;margin-top:10px;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;resize:vertical;box-sizing:border-box}
  .gest-foot{display:flex;align-items:center;gap:12px;margin-top:10px}
  .gest-save{padding:8px 16px;font-size:13px}
  .gest-save:disabled{opacity:.45;cursor:not-allowed}
  .gest-msg{font-size:12.5px;font-weight:600}
  .gest-msg.ok{color:var(--green)} .gest-msg.bad{color:var(--red)}
  .gest-hist{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
  .gest-hist-empty{font-size:12px;color:var(--muted)}
  .gest-hist-t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px}
  .gest-line{margin-bottom:9px;font-size:12.5px}
  .dispo-pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:20px;background:#EDEEF4;color:var(--navy)}
  .dispo-pill.ok{background:#E7F5EF;color:var(--green)} .dispo-pill.bad{background:#FBE9E7;color:var(--red)} .dispo-pill.warn{background:#FCF3E0;color:var(--amber)}
  .gest-line-meta{color:var(--muted);margin-left:8px}
  .gest-line-nota{color:var(--navy);margin-top:2px;font-size:12px}
  .gest-toggle{cursor:pointer}
  /* ── Modal de gestión (2 pasos) ── */
  .gm-overlay{position:fixed;inset:0;background:rgba(16,22,55,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
  .gm-box{background:#fff;border-radius:16px;width:min(560px,100%);max-height:88vh;overflow:auto;padding:24px;box-shadow:0 20px 60px rgba(16,22,55,.3);position:relative}
  .gm-x{position:absolute;top:10px;right:14px;border:none;background:none;font-size:26px;line-height:1;color:var(--muted);cursor:pointer;font-family:inherit}
  .gm-head{margin-bottom:18px;padding-right:24px}
  .gm-name{font-size:19px;font-weight:700;color:var(--navy)}
  .gm-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .gm-q{font-size:13.5px;font-weight:600;color:var(--navy);margin-bottom:9px}
  .gm-seg{display:flex;gap:10px;margin-bottom:14px}
  .gm-seg-b{flex:1;padding:13px;border:2px solid var(--border);border-radius:11px;background:#fff;font-size:14.5px;font-weight:700;color:var(--navy);cursor:pointer;font-family:inherit}
  .gm-seg-b:hover{border-color:var(--navy)}
  .gm-seg-b.loc.sel{border-color:var(--green);background:#E7F5EF;color:var(--green)}
  .gm-seg-b.noloc.sel{border-color:var(--navy);background:#EDEEF4;color:var(--navy)}
  .gm-results{min-height:38px;margin-bottom:6px}
  .gm-hint{font-size:12.5px;color:var(--muted);padding:8px 0}
  .gm-res-lab{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:9px}
  .gm-nota{width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:13px;resize:vertical;box-sizing:border-box;margin-top:8px}
  .gm-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap}
  .gm-agent{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);display:flex;gap:6px;align-items:center}
  .gm-agent select{padding:6px 9px;border:1.5px solid var(--border);border-radius:8px;font-size:12.5px;font-family:inherit;color:var(--navy);background:#fff;text-transform:none;letter-spacing:normal}
  .gm-foot-r{display:flex;align-items:center;gap:12px}
  .gm-save{padding:10px 18px}
  .gm-save:disabled{opacity:.45;cursor:not-allowed}
  .gm-openlink{display:inline-block;margin-top:10px;font-size:12.5px;font-weight:600;color:var(--navy);text-decoration:none;border:1.5px solid var(--border);border-radius:8px;padding:6px 11px}
  .gm-openlink:hover{border-color:var(--navy);background:#F4F3FA}
  .gm-hist{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
  .tel a{color:var(--navy);text-decoration:none;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tel a:hover{text-decoration:underline}
  .th-sort{cursor:pointer}
  .th-sort:hover{color:var(--navy)}

  @media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}}
  html.embed .wrap{padding-top:20px}
  html.embed header{display:none}
</style>
</head>
<body>

<div class="overlay" id="overlay">
  <div class="login">
    <img src="https://wearedomma.com/cdn/shop/files/Vector_06860792-3ad3-4c55-896f-7e93d3a52205.png?v=1771481473&width=400" alt="DOMMA">
    <h2>Fallos de pago</h2>
    <p>Panel interno · rescate de cobros fallidos</p>
    <input type="email" id="email" placeholder="tu@wearedomma.com" autocomplete="username">
    <input type="password" id="pass" placeholder="Contraseña" autocomplete="current-password">
    <button class="btn" onclick="login()" style="width:100%">Acceder</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div class="wrap" id="app" style="display:none">
  <header>
    <div class="brand">
      <img src="https://wearedomma.com/cdn/shop/files/Vector_06860792-3ad3-4c55-896f-7e93d3a52205.png?v=1771481473&width=400" alt="DOMMA">
      <div>
        <h1>Fallos de pago</h1>
        <div class="tag">Rescate y seguimiento de cobros fallidos · <span id="gen"></span></div>
      </div>
    </div>
    <button class="btn ghost" onclick="logout()">Salir</button>
  </header>

  <div class="controls">
    <div class="field"><label>Rango</label>
      <select id="rango" onchange="usarPreset(this.value)">
        <option value="7d">Últimos 7 días</option>
        <option value="30d" selected>Últimos 30 días</option>
        <option value="mes">Mes actual</option>
        <option value="prev">Mes anterior</option>
        <option value="90d">Últimos 90 días</option>
        <option value="ytd">Lo que va de año</option>
        <option value="custom">Personalizado</option>
      </select>
    </div>
    <div class="field"><label>Desde</label><input type="date" id="desde"></div>
    <div class="field"><label>Hasta</label><input type="date" id="hasta"></div>
    <div class="field cmp-wrap">
      <label class="cmp-check"><input type="checkbox" id="cmpOn" checked onchange="toggleCmp()"> Comparar con</label>
      <select id="cmpModo" onchange="toggleCmp()">
        <option value="anterior" selected>Periodo anterior</option>
        <option value="anio">Mismo periodo del año anterior</option>
        <option value="personalizado">Periodo concreto…</option>
      </select>
    </div>
    <div class="field cmp-cust" id="cmpCust" style="display:none"><label>Comp. desde</label><input type="date" id="cmpDesde"></div>
    <div class="field cmp-cust" id="cmpCust2" style="display:none"><label>Comp. hasta</label><input type="date" id="cmpHasta"></div>
    <button class="btn" onclick="load()">Aplicar</button>
    <div class="spacer"></div>
    <button class="btn ghost" onclick="load()" title="Vuelve a leer Appstle en vivo">↻ Actualizar</button>
  </div>

  <div class="tabs" id="tabs" style="display:none">
    <button class="tab on" data-t="resumen" onclick="setTab('resumen',this)">Resumen</button>
    <button class="tab"    data-t="listado" onclick="setTab('listado',this)">Listado · a quién llamar <span class="badge calm" id="bdgList">0</span></button>
    <button class="tab"    data-t="conversion" onclick="setTab('conversion',this)">Conversión WhatsApp</button>
  </div>

  <div id="cuerpo"><div class="loading">Cargando…</div></div>

  <div class="foot">Panel interno DOMMA · worker <code>gestorsubs-domma</code> · datos de Appstle en vivo</div>
</div>

<script>
// TODA la página lee de Appstle en vivo vía /failures-since (~5s, filtra por día
// de forma nativa). Se prefiere a Monday /board-items (reescanea todo el tablero,
// 1-3 min, y su campo de agente está vacío al 100%) y a /metricas-retencion, para
// que el Resumen y el Listado cuadren: una sola fuente.
const API_ITEMS = 'https://gestorsubs-domma.cristina-ed1.workers.dev/failures-since';
// Appstle no trae el móvil de ~40% de las clientas, pero Shopify sí (100%). Este
// endpoint lo rellena desde Shopify (cacheado en KV). Solo lectura, no envía nada.
const API_TEL = 'https://gestorsubs-domma.cristina-ed1.workers.dev/telefonos-shopify';
// Conversión de la secuencia de WhatsApp de fallo de pago (entraron→respondieron→pagaron
// + por toque). Lee el D1 de LUNA (follow_ups). Solo lectura, mismo token que la pestaña LUNA.
const API_CONV = 'https://luna-agent.cristina-ed1.workers.dev/api/metrics/fallo-pago-conversion';
const METRICS_TOKEN = 'ae054e9b8acb290020c6be1d0839832ef34145dfe5ea3acc';
const AUTH_API = 'https://domma-pro-api.cristina-ed1.workers.dev';
// Worker de bajas: resuelve teléfono→ID de contacto de WATI para abrir la conversación
// de la clienta (mismo endpoint que usa «Gestión suscripciones»). Requiere token admin/retencion.
const API_BAJAS = 'https://domma-bajas.cristina-ed1.workers.dev';

if(new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('embed');
(function(){ const m = location.hash.match(/token=([^&]+)/); if(m){ localStorage.setItem('domma_analytics_token', decodeURIComponent(m[1])); history.replaceState(null,'',location.pathname); } })();
let token = localStorage.getItem('domma_analytics_token') || '';
let TAB = 'resumen', PANES = {};
let ITEMS = [];               // fichas individuales del periodo
let CONV = null;              // embudo de conversión de la secuencia WhatsApp
let FILTRO = 'abiertas';      // filtro de desenlace del listado
let TIPO_F = 'todos';         // filtro de tipo: activos (fallo_pago) vs backlog (dunning_skipped)
let ORDEN = 'prioridad';      // orden del listado (defecto: importe×días = a quién llamar primero)

const d2s = d => d.toISOString().slice(0,10);
const hoy = () => d2s(new Date());
const addD = (s,n) => { const d=new Date(s+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d2s(d); };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pc  = v => (v==null?'—':v+'%');
// Formato es-ES determinista (no depende del ICU del navegador): 5671 -> "5.671 €",
// 39.2 -> "39,2 €", 29 -> "29 €".
const eur = v => {
  const [ent,dec] = (Math.round((v||0)*100)/100).toFixed(2).split('.');
  const miles = ent.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return (dec==='00' ? miles : miles+','+dec.replace(/0$/,'')) + ' €';
};

// ── Rango: mismos presets que /bajas, para que los paneles se manejen igual ──
const PRESETS={
  '7d':  ()=>({desde:addD(hoy(),-6),  hasta:hoy(), gran:'dia'}),
  '30d': ()=>({desde:addD(hoy(),-29), hasta:hoy(), gran:'semana'}),
  'mes': ()=>{ const h=hoy(); return {desde:h.slice(0,8)+'01', hasta:h, gran:'semana'}; },
  'prev':()=>{ const d=new Date(); const fin=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),0));
               const ini=new Date(Date.UTC(fin.getUTCFullYear(),fin.getUTCMonth(),1)); return {desde:d2s(ini),hasta:d2s(fin),gran:'semana'}; },
  '90d': ()=>({desde:addD(hoy(),-89), hasta:hoy(), gran:'mes'}),
  'ytd': ()=>({desde:hoy().slice(0,4)+'-01-01', hasta:hoy(), gran:'mes'}),
};
function usarPreset(k){
  document.getElementById('rango').value=k;
  if(k==='custom') return;
  const v=PRESETS[k]();
  document.getElementById('desde').value=v.desde;
  document.getElementById('hasta').value=v.hasta;
  load();
}

// Ventana comparada, calculada en el navegador (failures-since no compara solo).
function compWindow(desde, hasta, modo){
  if(modo==='personalizado'){
    return {desde:document.getElementById('cmpDesde').value||'', hasta:document.getElementById('cmpHasta').value||''};
  }
  if(modo==='anio'){
    const shift=s=>{const d=new Date(s+'T00:00:00Z'); d.setUTCFullYear(d.getUTCFullYear()-1); return d2s(d);};
    return {desde:shift(desde), hasta:shift(hasta)};
  }
  // 'anterior': mismo nº de días justo antes del periodo actual.
  const dias=Math.round((Date.parse(hasta+'T00:00:00Z')-Date.parse(desde+'T00:00:00Z'))/86400000)+1;
  const ph=addD(desde,-1), pd=addD(ph,-(dias-1));
  return {desde:pd, hasta:ph};
}

// Resume un payload de /failures-since en las cifras del panel. Solo la consulta
// base (rápida, ~5s): NO se usa ?recuperadas=1 (escanea miles de SUCCESS, lento y
// variable). Por eso no se muestra un % de rescate aquí — la recuperación real,
// que la cola viva de Appstle no permite contar (al pagar, el fallo desaparece),
// vive en el dashboard de cohortes/BI. En riesgo = suma del importe de las abiertas.
function resumir(fs){
  if(!fs) return null;
  const de=fs.desenlace||{};
  const total=fs.contratos_con_fallo||0;
  const abiertas=(de.abierta&&de.abierta.n)||0;
  const bajas=(de.baja&&de.baja.n)||0;
  const pausadas=(de.pausada&&de.pausada.n)||0;
  const enRiesgo=(fs.detalle||[]).filter(x=>x.desenlace==='abierta').reduce((s,x)=>s+(parseFloat(x.importe)||0),0);
  return {total, abiertas, bajas, pausadas, enRiesgo:Math.round(enRiesgo),
    pctAbiertas: total?Math.round(1000*abiertas/total)/10:null,
    pctBajas: total?Math.round(1000*bajas/total)/10:null};
}

// ── Delta: «más fallos es peor, más rescates es mejor» ──
function delta(actual, previo, opts){
  if(actual==null || previo==null) return '';
  const o=opts||{};
  const d=Math.round((actual-previo)*10)/10;
  if(!isFinite(d) || d===0) return `<span class="delta flat">= que ${ETIQ}</span>`;
  const bien = o.masEsMejor===false ? d<0 : d>0;
  return `<span class="delta ${bien?'up':'down'}">${d>0?'▲':'▼'} ${Math.abs(d)}${o.pp?' pp':''} vs ${ETIQ}</span>`;
}

const fsURL = (desde,hasta,extra)=>API_ITEMS+'?'+new URLSearchParams(Object.assign({desde,hasta},extra||{})).toString();
const getJSON = u => fetch(u).then(r=>r.json()).catch(e=>({error:e.message}));

async function load(){
  const cuerpo=document.getElementById('cuerpo');
  cuerpo.style.display='block';
  cuerpo.innerHTML=`<div class="loading">Cargando desde Appstle…</div>`;
  document.getElementById('tabs').style.display='none';

  const desde=document.getElementById('desde').value, hasta=document.getElementById('hasta').value;
  const cmpOn=document.getElementById('cmpOn').checked;
  const cmpModo=document.getElementById('cmpModo').value;
  ETIQ = etiquetaCmp();

  // Solo Appstle base (rápido): actual [+ comparación]. Una sola fuente que el
  // Listado y el Resumen comparten, para que las cifras cuadren.
  const calls = [ getJSON(fsURL(desde,hasta)) ];
  let cmp=null;
  if(cmpOn){
    cmp = compWindow(desde,hasta,cmpModo);
    if(cmp.desde && cmp.hasta) calls.push(getJSON(fsURL(cmp.desde,cmp.hasta)));
    else cmp=null;
  }
  try{
    const [fsA, fsP] = await Promise.all(calls);
    if(!fsA || fsA.error){
      cuerpo.innerHTML=`<div class="card"><h3>No se pudo leer Appstle</h3><p class="hint">${esc(fsA&&fsA.error||'sin respuesta')}. Prueba a «Actualizar».</p></div>`;
      return;
    }
    ITEMS = normalizarItems(fsA);
    render(fsA, fsP, cmp);
    enriquecerTelefonos();  // en segundo plano: rellena el móvil que Appstle no trae, desde Shopify
    cargarConversion(desde,hasta);  // en segundo plano: embudo de la secuencia WhatsApp (D1 LUNA)
    cargarGestiones().then(()=>{ if(TAB==='listado') refrescarListado(); });  // badges de última gestión (CRM)
  }catch(e){ cuerpo.innerHTML=`<div class="card"><h3>Error de conexión</h3><p class="hint">${esc(e.message)}</p></div>`; }
}

// ── Conversión de la secuencia de WhatsApp (D1 de LUNA), en segundo plano ──
async function cargarConversion(desde,hasta){

// Completa el teléfono que falta buscándolo en Shopify (cacheado en KV del worker).
// Prioriza las abiertas (la lista de llamadas). No bloquea el render: cuando vuelve,
// re-pinta el listado si está a la vista.
let ENRIQUECIENDO = false;
async function enriquecerTelefonos(){
  const faltan = ITEMS.filter(f=>!f.phone && f.email);
  if(!faltan.length){ ENRIQUECIENDO=false; if(TAB==='listado') refrescarListado(); return; }
  faltan.sort((a,b)=>(estadoCat(b.desenlace).abierta?1:0)-(estadoCat(a.desenlace).abierta?1:0));
  const emails=[...new Set(faltan.map(f=>f.email))].slice(0,80);
  ENRIQUECIENDO=true; if(TAB==='listado') refrescarListado();
  try{
    const r=await fetch(API_TEL+'?'+new URLSearchParams({emails:emails.join(','), max:'80'}));
    const d=await r.json();
    const tel=d.telefonos||{};
    ITEMS.forEach(f=>{ if(!f.phone && f.email && tel[f.email]){ f.phone=tel[f.email]; f.telShopify=true; } });
  }catch(e){}
  ENRIQUECIENDO=false;
  if(TAB==='listado') refrescarListado();
}
function refrescarListado(){ const c=document.getElementById('cuerpo'); if(c) c.innerHTML=renderListado(); }

// ── /failures-since → fichas planas y ordenables ──
function normalizarItems(ri){
  if(!ri || !Array.isArray(ri.detalle)) return [];
  const hoyMs = Date.parse(hoy()+'T00:00:00Z');
  return ri.detalle.map(it=>{
    const fecha = (it.primer_fallo||'').slice(0,10);
    const dias = fecha ? Math.max(0, Math.round((hoyMs - Date.parse(fecha+'T00:00:00Z'))/86400000)) : null;
    const importe = parseFloat(String(it.importe||'').replace(',', '.')) || 0;
    return {
      id: it.contract_id,
      nombre: limpiarNombre(it.nombre),
      email: (it.email||'').trim(),
      phone: (it.telefono||'').trim(),
      desenlace: (it.desenlace||'').trim() || 'abierta',
      tipoRaw: it.tipo || 'fallo_pago',
      tipo: it.tipo==='dunning_skipped' ? 'Dunning skipped' : 'Fallo pago',
      intentos: it.intentos_en_ventana ?? null,
      ultimo_pago: it.ultimo_pago_ok || null,
      importe, fecha, dias,
    };
  });
}

// ── Clasificación del desenlace para píldora y filtro «abiertas» ──
function estadoCat(desenlace){
  const e = (desenlace||'').toLowerCase();
  if(e==='abierta')    return {cat:'abierta',    cls:'red',   txt:'Abierta',    abierta:true};
  if(e==='recuperada') return {cat:'recuperada', cls:'green', txt:'Recuperada', abierta:false};
  if(e==='baja')       return {cat:'baja',       cls:'grey',  txt:'Se dio de baja', abierta:false};
  if(e==='pausada')    return {cat:'pausada',    cls:'amber', txt:'Pausada',    abierta:false};
  return {cat:'otro', cls:'grey', txt:desenlace||'—', abierta:true};
}

// Appstle guarda algunos nombres con el escape unicode roto (ñ → "u00f1",
// á → "u00e1"): decodifica esas secuencias sueltas. Defensivo: solo toca
// "u00XX" con XX hex, que no aparece en nombres reales.
function limpiarNombre(s){
  return String(s||'').trim().replace(/u00([0-9a-fA-F]{2})/g,(m,h)=>String.fromCharCode(parseInt(h,16)));
}
// Número legible + href para llamar. "+34 645 81 57 75" cuando es 34 + 9 dígitos.
function telFmt(phone){
  let p=String(phone||'').replace(/\D/g,'');
  if(!p) return null;
  if(p.length===9) p='34'+p;
  let disp='+'+p;
  if(p.startsWith('34') && p.length===11){
    const n=p.slice(2);
    disp='+34 '+n.slice(0,3)+' '+n.slice(3,5)+' '+n.slice(5,7)+' '+n.slice(7);
  }
  return {href:'+'+p, disp};
}
// Abre la conversación de la clienta en WATI (mismo comportamiento que «Gestión suscripciones»).
// El worker de bajas resuelve teléfono→ID de contacto de WATI; si no lo consigue (o no hay token)
// cae a wa.me. Abrimos la pestaña YA (síncrono) para no chocar con el bloqueador de popups.
async function abrirWati(phone){
  const tel = String(phone||'').replace(/\D/g,'');
  const w = window.open('about:blank','_blank');
  try{
    const r = await fetch(API_BAJAS+'/api/dashboard/wati-link', {method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body: JSON.stringify({phone: tel})});
    const d = await r.json().catch(()=>({}));
    if(d && d.url){ if(w) w.location = d.url; else window.open(d.url,'_blank','noopener'); }
    else if(w){ w.location = 'https://wa.me/'+(tel.length===9?'34'+tel:tel); }  // fallback si el worker no responde
  }catch(e){ if(w){ w.location = 'https://wa.me/'+(tel.length===9?'34'+tel:tel); } }
}

async function guardarGestion(){
  if(!GM||!GM.contacto||!GM.resultado) return;
  const btn=document.getElementById('gmSave'), msg=document.getElementById('gmMsg'), c0=GM.caso;
  btn.disabled=true; msg.textContent='Guardando…'; msg.className='gest-msg';
  const ag=document.getElementById('gmAgente').value||agenteActual();
  const body={tipo_caso:c0.tipo_caso||'fallo_pago', customer_id:c0.customer_id||'', contract_id:c0.contract_id||'', nombre:c0.nombre||'', email:c0.email||'', phone:c0.phone||'', contacto:GM.contacto, resultado:GM.resultado, agente:ag, nota:(document.getElementById('gmNota').value||'').trim()};
  try{
    const r=await fetch(API_BAJAS+'/api/dashboard/gestion',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(body)});
    const d=await r.json();
    if(d&&d.ok){
      const g=d.gestion||{...body,created_at:'ahora'}; const c=String(body.contract_id||'').split('.')[0];
      if(c){ GEST.byC[c]=GEST.byC[c]||[]; GEST.byC[c].unshift(g); }
      const cell=document.getElementById(GM.uid+'-gest'); if(cell) cell.innerHTML=gestPill(g);
      msg.textContent='Guardada ✓'; msg.className='gest-msg ok';
      setTimeout(cerrarGestion, 550);
    } else { msg.textContent=d&&d.error==='faltan_datos'?'Elige un resultado':'No se pudo guardar'; msg.className='gest-msg bad'; btn.disabled=false; }
  }catch(e){ msg.textContent='Error de conexión'; msg.className='gest-msg bad'; btn.disabled=false; }
}

function setTab(t, el){
  TAB=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on', b.dataset.t===t));
  const c=document.getElementById('cuerpo');
  c.style.display='block';
  if(t==='listado') c.innerHTML = renderListado();
  else if(t==='conversion') c.innerHTML = renderConversion();
  else c.innerHTML = PANES[t] || '';
  if(el) el.blur();
}

// ══════════ TAB: CONVERSIÓN DE LA SECUENCIA DE WHATSAPP ══════════
function renderConversion(){
  const sect = `<div class="sect">Conversión de la secuencia de WhatsApp · fallo de pago</div>`;
  if(CONV===null) return sect+`<div class="loading">Cargando el embudo desde LUNA…</div>`;
  if(CONV.error) return sect+`<div class="card"><p class="hint">No se pudo leer el embudo de LUNA: ${esc(CONV.error)}.</p></div>`;

  const ent = CONV.entraron||0;
  const resp = CONV.respondieron||{n:0,pct:null};
  const pag = CONV.pagaron||{n:0,pct:null};
  const kpi=(cls,lab,val,sub)=>`<div class="kpi ${cls||''}"><div class="lab">${lab}</div><div class="val">${val}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;

  const kpis = `<div class="kpis" style="grid-template-columns:repeat(3,1fr)">
      ${kpi('','Entraron en la secuencia', ent, `clientas distintas con ≥1 WhatsApp enviado`)}
      ${kpi('','Respondieron', resp.n, `${pc(resp.pct)} escribieron en 72h`)}
      ${kpi('hero','Pagaron', pag.n, `${pc(pag.pct)} recuperadas · secuencia cancelada por pago`)}
    </div>`;

  const t = CONV.por_toque||[];
  const maxEnv = Math.max(1, ...t.map(x=>x.enviados||0));
  const filas = t.map(x=>`<tr>
      <td><b>${esc(x.toque)}</b></td>
      <td class="num">${x.enviados||0}</td>
      <td class="num">${x.pendientes||0}</td>
      <td class="num">${x.pagados||0}</td>
      <td style="width:120px"><div class="bar"><i style="width:${Math.round(100*(x.enviados||0)/maxEnv)}%"></i></div></td>
    </tr>`).join('');

  const tabla = `<div class="card">
      <h3>Por toque</h3>
      <p class="hint">Cuántos WhatsApp de cada toque han salido, cuántos están pendientes y en cuántos la clienta ya había pagado (se canceló). Fíjate en que en el toque tardío la mayoría <b>ya ha pagado antes de que salga</b> — la recuperación es temprana.</p>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>Toque</th><th class="num">Enviados</th><th class="num">Pendientes</th><th class="num">Pagó antes</th><th></th></tr></thead>
        <tbody>${filas || `<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:24px">Sin datos en el periodo</td></tr>`}</tbody>
      </table></div>
    </div>`;

  const aviso = `<div class="avisos"><b>Cómo leer esto</b><ul>
      <li>«Pagaron» es un <b>suelo</b>: cuenta las secuencias que Monday canceló por pago resuelto; alguna paga sin que se cancele, así que la conversión real es algo mayor.</li>
      <li>Fuente: D1 de LUNA (<code>follow_ups</code> + <code>conversaciones</code>), la misma que envía los WhatsApp. Ventana: ${esc((CONV.ventana&&CONV.ventana.desde)||'')} → ${esc((CONV.ventana&&CONV.ventana.hasta)||'')}.</li>
      <li>Referencia: una <b>persona llamando</b> convierte 33-61% (análisis ROI). El WhatsApp es el primer toque barato; las que no pagan van a la llamada de Carme (listado).</li>
    </ul></div>`;

  return sect + kpis + tabla + aviso;
}

// Controles del listado (viven dentro del pane, se re-renderiza al vuelo)
function setFiltro(v){ FILTRO=v; document.getElementById('cuerpo').innerHTML=renderListado(); }
function setTipo(v){ TIPO_F=v; document.getElementById('cuerpo').innerHTML=renderListado(); }
function setOrden(v){ ORDEN=(ORDEN===v)? v : v; document.getElementById('cuerpo').innerHTML=renderListado(); }

function renderListado(){
  let filas = ITEMS.slice();
  if(FILTRO==='abiertas') filas = filas.filter(f=>estadoCat(f.desenlace).abierta);
  else if(FILTRO!=='todas') filas = filas.filter(f=>estadoCat(f.desenlace).cat===FILTRO);
  // Tipo: separa fallos ACTIVOS (Appstle sigue reintentando) del BACKLOG (dunning agotado,
  // Appstle ya no reintenta → decisión, no llamada urgente). Ortogonal al desenlace.
  if(TIPO_F==='activo')  filas = filas.filter(f=>f.tipoRaw!=='dunning_skipped');
  else if(TIPO_F==='backlog') filas = filas.filter(f=>f.tipoRaw==='dunning_skipped');

  const prio = f => (f.importe||0) * Math.max(1, f.dias||0); // € en riesgo × antigüedad
  filas.sort((a,b)=>{
    if(ORDEN==='importe') return (b.importe||0)-(a.importe||0);
    if(ORDEN==='dias')    return (b.dias||0)-(a.dias||0);
    if(ORDEN==='estado')  return a.desenlace.localeCompare(b.desenlace);
    return prio(b)-prio(a); // prioridad (defecto): importe×días
  });

  const opt=(v,txt)=>`<option value="${v}"${FILTRO===v?' selected':''}>${txt}</option>`;
  const optT=(v,txt)=>`<option value="${v}"${TIPO_F===v?' selected':''}>${txt}</option>`;
  const bar=`<div class="listbar">
      <select onchange="setFiltro(this.value)">
        ${opt('abiertas','Abiertas · a llamar')}
        ${opt('recuperada','Recuperadas')}
        ${opt('baja','Se dieron de baja')}
        ${opt('pausada','Pausadas')}
        ${opt('todas','Todas')}
      </select>
      <select onchange="setTipo(this.value)" title="Activos = Appstle sigue reintentando. Backlog = dunning agotado (Appstle ya no reintenta) → a decidir, no llamada urgente.">
        ${optT('todos','Tipo: todos')}
        ${optT('activo','Solo activos (reintentando)')}
        ${optT('backlog','Solo backlog (dunning agotado)')}
      </select>
      <select onchange="setOrden(this.value)">
        <option value="prioridad"${ORDEN==='prioridad'?' selected':''}>Ordenar: prioridad (importe×días)</option>
        <option value="dias"${ORDEN==='dias'?' selected':''}>Ordenar: días esperando</option>
        <option value="importe"${ORDEN==='importe'?' selected':''}>Ordenar: importe</option>
        <option value="estado"${ORDEN==='estado'?' selected':''}>Ordenar: desenlace</option>
      </select>
      <span class="count">${filas.length} fallo${filas.length===1?'':'s'} · periodo ${esc(document.getElementById('desde').value)} → ${esc(document.getElementById('hasta').value)}${ENRIQUECIENDO?' · <span style="color:var(--amber)">completando teléfonos desde Shopify…</span>':''}</span>
    </div>`;

  if(!ITEMS.length) return `<div class="sect">Listado de fallos</div>${bar}<div class="card"><p class="hint">No hay fallos de pago en este periodo (o Appstle no respondió). Prueba a ampliar el rango.</p></div>`;

  const rows = filas.map((f,i)=>{
    const uid='gpf'+i;
    const sc=estadoCat(f.desenlace);
    const caso={tipo_caso:'fallo_pago', customer_id:'', contract_id:f.id, nombre:f.nombre, email:f.email, phone:f.phone,
      contexto:`${esc(sc.txt)} · ${eur(f.importe)}${f.dias!=null?' · '+f.dias+' d':''}`};
    CASOS[uid]=caso;
    const lg=ultimaGestion(caso);
    const dCls = f.dias>=14?'bad':(f.dias>=7?'warn':'');
    const tieneTel = !!String(f.phone||'').replace(/\D/g,'');
    const tel = telHref(f.phone);
    const acts=[
      tel?`<a href="${tel}" title="Llamar por Ringover">Llamar</a>`:'',
      tieneTel?`<a href="#" onclick="abrirWati('${esc(String(f.phone))}');return false" title="Abrir su conversación en WATI">WhatsApp</a>`:'',
      f.email?`<a href="mailto:${esc(f.email)}?subject=${encodeURIComponent('DOMMA · tu suscripción')}">Email</a>`:'',
      `<a href="#" class="gest-toggle" onclick="abrirGestion('${uid}');return false">Gestionar</a>`,
    ].filter(Boolean).join('');
    const intxt = f.intentos!=null ? `${f.intentos} intento${f.intentos===1?'':'s'}` : '';
    const t = telFmt(f.phone);
    const telCell = t
      ? `<a href="tel:${t.href}">${t.disp}</a>${f.telShopify?' <span class="muted" style="font-weight:400" title="Recuperado de Shopify (Appstle no lo traía)">·Shopify</span>':''}`
      : (ENRIQUECIENDO?'<span class="muted">buscando…</span>':'<span class="muted">—</span>');
    const nombreCell = f.nombre
      ? `<a href="#" class="cli-link" onclick="verSuscripcion('','${esc(String(f.id||''))}');return false" title="Abrir su suscripción en Shopify/Appstle">${esc(f.nombre)}</a>`
      : (f.email?esc(f.email):'<span class="muted">sin datos</span>');
    return `<tr>
      <td class="cli">${nombreCell}${f.nombre&&f.email?`<span class="em">${esc(f.email)}</span>`:''}<span class="em">${esc(f.tipo)}${intxt?' · '+intxt:''}</span></td>
      <td><span class="pill ${sc.cls}" title="¿Ha pagado? Dato de Appstle en vivo">${esc(sc.txt)}</span></td>
      <td id="${uid}-gest">${gestPill(lg)}</td>
      <td class="num"><b>${eur(f.importe)}</b></td>
      <td class="num"><span class="dias ${dCls}">${f.dias==null?'—':f.dias+' d'}</span></td>
      <td>${f.fecha?esc(f.fecha):'—'}</td>
      <td class="tel">${telCell}</td>
      <td class="acts">${acts}</td>
    </tr>`;
  }).join('');

  return `<div class="sect">Listado de fallos · a quién llamar</div>${bar}
    <div class="card" style="margin-top:8px">
      <p class="hint"><b>Cobro</b> = si ha pagado (Appstle en vivo): «Abierta» sigue sin cobrar. <b>Gestión</b> = lo que hicimos en la llamada. «Días» ≥7 en ámbar, ≥14 en rojo. La lista de llamadas de Carme son las de cobro «Abierta».</p>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>Clienta</th><th>Cobro</th><th>Gestión</th><th class="num">Importe</th><th class="num">Días</th><th>1er fallo</th><th>Teléfono</th><th>Contactar</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:24px">Sin fallos con este filtro</td></tr>`}</tbody>
      </table></div>
    </div>`;
}

function render(fsA, fsP, cmp){
  const a=resumir(fsA);
  const p=cmp?resumir(fsP):null;
  const hayCmp=!!p;
  document.getElementById('gen').textContent='datos de '+new Date(fsA.generado||Date.parse(hoy())).toLocaleString('es-ES',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});

  const kpi=(cls,lab,val,sub,dl)=>`<div class="kpi ${cls||''}"><div class="lab">${lab}</div><div class="val">${val}</div>${sub?`<div class="sub">${sub}</div>`:''}${dl||''}</div>`;
  const pAbi=p?p.abiertas:null, pRie=p?p.enRiesgo:null, pTot=p?p.total:null, pBaj=p?p.bajas:null;

  // ── Titular ──
  const titular = `<div class="titular">
      En el periodo hay <b style="color:var(--red)">${a.abiertas}</b> fallo${a.abiertas===1?'':'s'} de pago sin cobrar (a llamar), con <b>${eur(a.enRiesgo)}</b> en riesgo;
      <b>${a.bajas}</b> acabaron en baja${a.pausadas?` y <b>${a.pausadas}</b> en pausa`:''}.
      <div class="sub">Periodo: ${esc(document.getElementById('desde').value)} → ${esc(document.getElementById('hasta').value)}${hayCmp?` · comparado con ${esc(cmp.desde)} → ${esc(cmp.hasta)}`:' · sin comparación'}</div>
    </div>`;

  const avisos=`<div class="avisos"><b>Cómo leer esto</b><ul>
      <li><b>«Abiertas»</b> = fallos que siguen sin cobrar. Es la lista de llamadas de Carme y cuadra exactamente con la pestaña «Listado».</li>
      <li>Todo sale de <b>Appstle en vivo</b>, una sola fuente para Resumen y Listado — por eso las cifras casan.</li>
      <li>El <b>% de rescate</b> histórico no se muestra aquí: la cola de Appstle es viva (al pagar, el fallo desaparece), así que la recuperación real se mide en el dashboard de cohortes/BI, no aquí.</li>
    </ul></div>`;

  // ══════════ RESUMEN ══════════
  PANES.resumen = titular + `
    <div class="sect">Cómo vamos${hayCmp?` · comparado con ${ETIQ}`:''}</div>
    <div class="kpis">
      ${kpi('hero','Abiertas · a llamar', a.abiertas, `${pc(a.pctAbiertas)} de ${a.total} fallos · ${eur(a.enRiesgo)} en riesgo`, delta(a.abiertas,pAbi,{masEsMejor:false}))}
      ${kpi('','Dinero en riesgo', eur(a.enRiesgo), 'suma de las abiertas', delta(a.enRiesgo,pRie,{masEsMejor:false}))}
      ${kpi('','Fallos en el periodo', a.total, 'contratos con algún fallo', delta(a.total,pTot,{masEsMejor:false}))}
      ${kpi('','Acabaron en baja', a.bajas, `${pc(a.pctBajas)} de los fallos`, delta(a.bajas,pBaj,{masEsMejor:false}))}
    </div>

    <div class="sect">Qué hay que atender</div>
    <div class="todo">
      <button class="act ${a.abiertas?'alert':'ok'}" onclick="setTab('listado')">
        <div class="lab">Fallos abiertos</div><div class="val">${a.abiertas}</div>
        <div class="sub">${a.abiertas?`siguen sin cobrar · ${eur(a.enRiesgo)} en riesgo`:'ningún fallo sin cobrar 👌'}</div>
        <span class="go">Ver el listado y a quién llamar →</span></button>
    </div>` + avisos;

  // Badge del listado: fallos abiertos = dinero esperando una llamada.
  const bdg=document.getElementById('bdgList');
  bdg.textContent=a.abiertas;
  bdg.className='badge'+(a.abiertas?'':' calm');

  // ── Evolución por semana (de failures-since) ──
  const serie=(fsA.por_semana||[]).slice().sort((x,y)=>String(x.semana).localeCompare(String(y.semana)));
  const max=Math.max(1,...serie.map(s=>s.total||0));
  const cols=[{t:'Fallos',f:s=>s.total},{t:'Abiertas',f:s=>s.abierta},{t:'Baja',f:s=>s.baja}];
  PANES.resumen += `<div class="card">
      <h3>Evolución de los fallos</h3><p class="hint">Fallos que entraron cada semana (por fecha del primer intento fallido) y en qué acabaron.</p>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>Semana</th>${cols.map(c=>`<th class="num">${c.t}</th>`).join('')}<th></th></tr></thead>
        <tbody>${serie.length?serie.map(s=>`<tr><td><b>${esc(s.semana)}</b></td>
          ${cols.map(c=>`<td class="num">${c.f(s)}</td>`).join('')}
          <td style="width:90px"><div class="bar"><i style="width:${Math.round(100*(s.total||0)/max)}%"></i></div></td></tr>`).join('')
          :`<tr><td colspan="${cols.length+2}" style="text-align:center;color:var(--muted);padding:24px">Sin datos en el periodo</td></tr>`}</tbody>
      </table></div></div>`;

  document.getElementById('tabs').style.display='flex';
  setTab(TAB);
}

function arrancar(){
  document.getElementById('overlay').style.display='none';
  document.getElementById('app').style.display='block';
  usarPreset('30d');
}
document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
document.getElementById('email').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
if(token) arrancar();
</script>
