<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>DOMMA — Acciones retención</title>
<style>
  :root{
    --navy:#1C296A; --navy-2:#2C3A85; --bg:#F8F7F5; --card:#fff;
    --border:#e6e6ea; --line:#EFEDE8; --muted:#6B6B6B; --track:#EFEDF0;
    --green:#1E7A5A; --amber:#B77B12; --red:#B23A3A;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--navy);font-size:14px}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 20px 60px}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand img{height:26px}
  h1{font-size:20px;font-weight:700}
  .tag{font-size:12px;color:var(--muted)}
  .btn{background:var(--navy);color:#fff;border:none;border-radius:9px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn:hover{background:var(--navy-2)}
  .btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--border)}
  .btn.ghost:hover{border-color:var(--navy)}
  .muted{color:var(--muted)}

  /* LOGIN */
  .overlay{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:999}
  .login{background:#fff;border-radius:16px;padding:36px;width:340px;max-width:90vw;text-align:center}
  .login img{height:26px;margin-bottom:16px}
  .login h2{font-size:19px;margin-bottom:4px}
  .login p{font-size:12.5px;color:var(--muted);margin-bottom:20px}
  .login input{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:8px;margin-bottom:10px;font-size:14px;font-family:inherit;outline:none}
  .login input:focus{border-color:var(--navy)}
  .err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:16px}

  .controls{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:18px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .field input,.field select{padding:8px 11px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:#fff}
  .field input:focus,.field select:focus{border-color:var(--navy)}
  .spacer{flex:1}
  .cmp-check{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
  .cmp-check input{width:14px;height:14px;accent-color:var(--navy);cursor:pointer}
  .cmp-wrap select:disabled{opacity:.45;cursor:not-allowed}

  /* Pestañas */
  .tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--border);margin-bottom:22px;flex-wrap:wrap}
  .tab{background:none;border:none;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;
    padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;
    display:flex;align-items:center;gap:7px}
  .tab:hover{color:var(--navy)}
  .tab.on{color:var(--navy);border-bottom-color:var(--navy)}
  .badge{background:var(--red);color:#fff;font-size:10.5px;font-weight:700;border-radius:20px;padding:1px 6px;min-width:17px;text-align:center}
  .badge.calm{background:var(--track);color:var(--muted)}

  /* Titular */
  .titular{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--navy);
    border-radius:12px;padding:16px 18px;margin-bottom:18px;font-size:14.5px;line-height:1.55}
  .titular .sub{font-size:12.5px;color:var(--muted);margin-top:6px}

  .sect{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:26px 0 10px}
  .sect:first-child{margin-top:0}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:15px 16px}
  .kpi .lab{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:7px}
  .kpi .val{font-size:27px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .kpi .sub{font-size:12px;color:var(--muted);margin-top:5px}
  .kpi.hero{background:linear-gradient(135deg,#1C296A,#2C3A85);border-color:#1C296A;color:#fff}
  .kpi.hero .lab,.kpi.hero .sub{color:#C9CEEA}
  .delta{font-size:12px;font-weight:650;margin-top:6px;display:inline-block}
  .up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--muted)}
  .kpi.hero .up{color:#8FE3BE} .kpi.hero .down{color:#FFB4AC} .kpi.hero .flat{color:#C9CEEA}

  /* Tarjetas de acción */
  .todo{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .act{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:15px 16px;
    cursor:pointer;text-align:left;font-family:inherit;color:inherit;transition:border-color .12s,box-shadow .12s}
  .act:hover{border-color:var(--navy);box-shadow:0 2px 12px rgba(28,41,106,.07)}
  .act .lab{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:7px}
  .act .val{font-size:27px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .act .sub{font-size:12px;color:var(--muted);margin-top:5px}
  .act .go{font-size:12px;font-weight:650;color:var(--navy);margin-top:9px;display:block}
  .act.alert{border-color:#E9BFBA;background:#FEF7F6} .act.alert .val{color:var(--red)}
  .act.ok .val{color:var(--green)}

  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-top:12px}
  .card h3{font-size:14px;margin-bottom:3px}
  .card .hint{font-size:12.5px;color:var(--muted);margin-bottom:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
  th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:600;white-space:nowrap}
  tbody tr:last-child td{border-bottom:none}
  td.num,th.num{text-align:right}
  .bar{height:7px;border-radius:4px;background:#EDEEF4;overflow:hidden;min-width:60px}
  .bar > i{display:block;height:100%;background:var(--navy);border-radius:4px}
  .avisos{background:#FCF3E0;border:1px solid #EAD9A8;color:#8A6206;font-size:12.5px;padding:12px 15px;border-radius:10px;margin-top:18px}
  .avisos ul{margin:6px 0 0 16px}
  .avisos li{margin-bottom:3px}
  .loading{text-align:center;color:var(--muted);padding:50px;font-size:13px}
  .foot{font-size:11.5px;color:var(--muted);margin-top:26px;text-align:center}
  @media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}.todo{grid-template-columns:1fr}}
  html.embed .wrap{padding-top:20px}
  html.embed header{display:none}
</style>
</head>
<body>

<div class="overlay" id="overlay">
  <div class="login">
    <img src="https://wearedomma.com/cdn/shop/files/Vector_06860792-3ad3-4c55-896f-7e93d3a52205.png?v=1771481473&width=400" alt="DOMMA">
    <h2>Acciones retención</h2>
    <p>Panel interno · acceso admin DOMMA</p>
    <input type="email" id="email" placeholder="tu@wearedomma.com" autocomplete="username">
    <input type="password" id="pass" placeholder="Contraseña" autocomplete="current-password">
    <button class="btn" onclick="login()" style="width:100%">Acceder</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div class="wrap" id="app" style="display:none">
  <header>
    <div class="brand">
      <img src="https://wearedomma.com/cdn/shop/files/Vector_06860792-3ad3-4c55-896f-7e93d3a52205.png?v=1771481473&width=400" alt="DOMMA">
      <div>
        <h1>Acciones retención</h1>
        <div class="tag">Repesca de bajas y rescate de fallos de pago · <span id="gen"></span></div>
      </div>
    </div>
    <button class="btn ghost" onclick="logout()">Salir</button>
  </header>

  <div class="controls">
    <div class="field"><label>Rango</label>
      <select id="rango" onchange="usarPreset(this.value)">
        <option value="7d">Últimos 7 días</option>
        <option value="30d" selected>Últimos 30 días</option>
        <option value="mes">Mes actual</option>
        <option value="prev">Mes anterior</option>
        <option value="90d">Últimos 90 días</option>
        <option value="ytd">Lo que va de año</option>
        <option value="custom">Personalizado</option>
      </select>
    </div>
    <div class="field"><label>Desde</label><input type="date" id="desde"></div>
    <div class="field"><label>Hasta</label><input type="date" id="hasta"></div>
    <div class="field"><label>Agrupar por</label>
      <select id="gran"><option value="dia">Día</option><option value="semana" selected>Semana</option><option value="mes">Mes</option></select>
    </div>
    <div class="field"><label>Madurez mínima</label>
      <select id="madurez">
        <option value="0">Sin filtro</option>
        <option value="14">14 días</option>
        <option value="30">30 días</option>
      </select>
    </div>
    <div class="field cmp-wrap">
      <label class="cmp-check"><input type="checkbox" id="cmpOn" checked onchange="toggleCmp()"> Comparar con</label>
      <select id="cmpModo" onchange="toggleCmp()">
        <option value="anterior" selected>Periodo anterior</option>
        <option value="anio">Mismo periodo del año anterior</option>
        <option value="personalizado">Periodo concreto…</option>
      </select>
    </div>
    <div class="field cmp-cust" id="cmpCust" style="display:none"><label>Comp. desde</label><input type="date" id="cmpDesde"></div>
    <div class="field cmp-cust" id="cmpCust2" style="display:none"><label>Comp. hasta</label><input type="date" id="cmpHasta"></div>
    <button class="btn" onclick="load()">Aplicar</button>
    <div class="spacer"></div>
    <button class="btn ghost" onclick="load(true)" title="Recalcula contra Monday y Appstle (tarda ~2 min)">↻ Recalcular</button>
  </div>

  <div class="tabs" id="tabs" style="display:none">
    <button class="tab on" data-t="resumen" onclick="setTab('resumen',this)">Resumen</button>
    <button class="tab"    data-t="bajas"   onclick="setTab('bajas',this)">Solicitudes de baja</button>
    <button class="tab"    data-t="fallos"  onclick="setTab('fallos',this)">Fallos de pago <span class="badge calm" id="bdgFallos">0</span></button>
  </div>

  <div id="cuerpo"><div class="loading">Cargando…</div></div>

  <div class="foot">Panel interno DOMMA · worker <code>gestorsubs-domma</code> · tableros Monday + Appstle en vivo</div>
</div>

<script>
const API = 'https://gestorsubs-domma.cristina-ed1.workers.dev/metricas-retencion';
const AUTH_API = 'https://domma-pro-api.cristina-ed1.workers.dev';

if(new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('embed');
(function(){ const m = location.hash.match(/token=([^&]+)/); if(m){ localStorage.setItem('domma_analytics_token', decodeURIComponent(m[1])); history.replaceState(null,'',location.pathname); } })();
let token = localStorage.getItem('domma_analytics_token') || '';
let TAB = 'resumen', PANES = {};

const d2s = d => d.toISOString().slice(0,10);
const hoy = () => d2s(new Date());
const addD = (s,n) => { const d=new Date(s+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d2s(d); };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pc  = v => (v==null?'—':v+'%');
const eur = v => (v||0).toLocaleString('es-ES')+' €';

function login(){
  const email=document.getElementById('email').value.trim(), pass=document.getElementById('pass').value;
  const err=document.getElementById('loginErr'); err.textContent='';
  fetch(AUTH_API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})})
    .then(r=>r.json()).then(d=>{
      const role=d.role||(d.user&&d.user.role);
      if(d.token&&role==='admin'){ token=d.token; localStorage.setItem('domma_analytics_token',token); arrancar(); }
      else if(d.token){ err.textContent='Tu usuario no tiene acceso admin'; }
      else { err.textContent='Credenciales incorrectas'; }
    }).catch(()=>{ err.textContent='No se pudo conectar'; });
}
function logout(){ localStorage.removeItem('domma_analytics_token'); location.reload(); }

// ── Rango: mismos presets que /bajas, para que las dos pestañas se manejen igual ──
const PRESETS={
  '7d':  ()=>({desde:addD(hoy(),-6),  hasta:hoy(), gran:'dia'}),
  '30d': ()=>({desde:addD(hoy(),-29), hasta:hoy(), gran:'semana'}),
  'mes': ()=>{ const h=hoy(); return {desde:h.slice(0,8)+'01', hasta:h, gran:'semana'}; },
  'prev':()=>{ const d=new Date(); const fin=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),0));
               const ini=new Date(Date.UTC(fin.getUTCFullYear(),fin.getUTCMonth(),1)); return {desde:d2s(ini),hasta:d2s(fin),gran:'semana'}; },
  '90d': ()=>({desde:addD(hoy(),-89), hasta:hoy(), gran:'mes'}),
  'ytd': ()=>({desde:hoy().slice(0,4)+'-01-01', hasta:hoy(), gran:'mes'}),
};
function usarPreset(k){
  document.getElementById('rango').value=k;
  if(k==='custom') return; // el usuario pone las fechas a mano y pulsa Aplicar
  const v=PRESETS[k]();
  document.getElementById('desde').value=v.desde;
  document.getElementById('hasta').value=v.hasta;
  document.getElementById('gran').value=v.gran;
  load();
}
// Tocar las fechas a mano pasa el desplegable a "Personalizado".
['desde','hasta'].forEach(id=>document.getElementById(id)
  .addEventListener('change',()=>{document.getElementById('rango').value='custom';}));

function toggleCmp(){
  const on=document.getElementById('cmpOn').checked;
  const modo=document.getElementById('cmpModo').value;
  document.getElementById('cmpModo').disabled=!on;
  const cust=on&&modo==='personalizado';
  document.getElementById('cmpCust').style.display=cust?'flex':'none';
  document.getElementById('cmpCust2').style.display=cust?'flex':'none';
}

// La ventana comparada la calcula el worker; aquí solo se le pone nombre.
function etiquetaCmp(){
  if(!document.getElementById('cmpOn').checked) return '';
  return {anterior:'el periodo anterior', anio:'el año pasado', personalizado:'el periodo elegido'}[document.getElementById('cmpModo').value] || 'el periodo comparado';
}
let ETIQ = 'el periodo anterior';

// ── Delta: «mejor» depende de la métrica (más fallos es peor, más rescates es mejor) ──
function delta(actual, previo, opts){
  if(actual==null || previo==null) return '';
  const o=opts||{};
  const d=Math.round((actual-previo)*10)/10;
  if(!isFinite(d) || d===0) return `<span class="delta flat">= que ${ETIQ}</span>`;
  const bien = o.masEsMejor===false ? d<0 : d>0;
  return `<span class="delta ${bien?'up':'down'}">${d>0?'▲':'▼'} ${Math.abs(d)}${o.pp?' pp':''} vs ${ETIQ}</span>`;
}

async function load(refresh){
  const cuerpo=document.getElementById('cuerpo');
  cuerpo.style.display='block';
  cuerpo.innerHTML=`<div class="loading">${refresh?'Recalculando contra Monday y Appstle… puede tardar ~2 minutos':'Cargando…'}</div>`;
  document.getElementById('tabs').style.display='none';
  const q=new URLSearchParams({
    desde:document.getElementById('desde').value,
    hasta:document.getElementById('hasta').value,
    granularidad:document.getElementById('gran').value,
    madurez:document.getElementById('madurez').value,
  });
  const cmpOn=document.getElementById('cmpOn').checked;
  const cmpModo=document.getElementById('cmpModo').value;
  q.set('comparar', cmpOn?cmpModo:'ninguna');
  if(cmpOn&&cmpModo==='personalizado'){
    q.set('comp_desde',document.getElementById('cmpDesde').value||'');
    q.set('comp_hasta',document.getElementById('cmpHasta').value||'');
  }
  if(refresh) q.set('refresh','1');
  ETIQ = etiquetaCmp();
  try{
    const r=await fetch(API+'?'+q.toString());
    const d=await r.json();
    if(d.error){ cuerpo.innerHTML=`<div class="card"><h3>No hay datos todavía</h3><p class="hint">${esc(d.error)} — ${esc(d.pista||'')}. Pulsa «Recalcular».</p></div>`; return; }
    render(d);
  }catch(e){ cuerpo.innerHTML=`<div class="card"><h3>Error de conexión</h3><p class="hint">${esc(e.message)}</p></div>`; }
}

function setTab(t, el){
  TAB=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on', b.dataset.t===t));
  const c=document.getElementById('cuerpo');
  c.style.display='block';
  c.innerHTML = PANES[t] || '';
  if(el) el.blur();
}

function render(d){
  const a=d.actual;
  const hayCmp=!!d.anterior;
  // Sin comparación activa: objeto de nulos para que deltas y subtítulos se apaguen solos.
  const p=d.anterior||{bajas:{solicitudes:null,intentos_retencion:null,pct_intentos:null,repescadas:null,pct_exito_intento:null},
                      fallos:{fichas:null,rescatados:null,pct_rescate:null,rescatados_30d:null,pct_rescate_30d:null,sin_tocar:null},
                      ventana:{desde:'',hasta:''}};
  document.getElementById('gen').textContent='datos de '+new Date(d.generado).toLocaleString('es-ES',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});

  const kpi=(cls,lab,val,sub,dl)=>`<div class="kpi ${cls||''}"><div class="lab">${lab}</div><div class="val">${val}</div>${sub?`<div class="sub">${sub}</div>`:''}${dl||''}</div>`;
  const sinIntento = a.bajas.solicitudes - a.bajas.intentos_retencion;

  // ── Titular: las dos palancas del panel, en una frase ──
  const titular = `<div class="titular">
      Llegaron <b>${a.bajas.solicitudes}</b> solicitud${a.bajas.solicitudes===1?'':'es'} de baja: intentamos retener <b>${a.bajas.intentos_retencion}</b>
      y ${a.bajas.repescadas===1?'sigue':'siguen'} con nosotras <b style="color:var(--green)">${a.bajas.repescadas}</b>.
      En paralelo, <b>${a.fallos.fichas}</b> fallo${a.fallos.fichas===1?'':'s'} de pago ${a.fallos.fichas===1?'puso':'pusieron'} <b>${eur(a.fallos.importe_en_riesgo)}</b> en riesgo
      y recuperamos <b style="color:var(--green)">${a.fallos.rescatados}</b>${a.fallos.sin_tocar?`, con <b style="color:var(--red)">${a.fallos.sin_tocar}</b> todavía sin tocar`:''}.
      <div class="sub">Periodo: ${esc(document.getElementById('desde').value)} → ${esc(document.getElementById('hasta').value)}${hayCmp?` · comparado con ${esc(p.ventana.desde)} → ${esc(p.ventana.hasta)}`:' · sin comparación'}</div>
    </div>`;

  const avisos=`<div class="avisos"><b>Cómo leer esto</b><ul>${(d.avisos||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;

  // ══════════ RESUMEN: los 4 números que mueven la aguja + qué atender ══════════
  PANES.resumen = titular + `
    <div class="sect">Cómo vamos${hayCmp?` · comparado con ${ETIQ}`:''}</div>
    <div class="kpis">
      ${kpi('hero','Éxito del intento', pc(a.bajas.pct_exito_intento), `de las ${a.bajas.intentos_retencion} que intentamos retener`, delta(a.bajas.pct_exito_intento,p.bajas.pct_exito_intento,{pp:true}))}
      ${kpi('','Repescadas', a.bajas.repescadas, 'siguen con la suscripción viva', delta(a.bajas.repescadas,p.bajas.repescadas))}
      ${kpi('','Rescate de pagos ≤30 días', pc(a.fallos.pct_rescate_30d), `${a.fallos.rescatados_30d} de ${a.fallos.fichas} fallos`, delta(a.fallos.pct_rescate_30d,p.fallos.pct_rescate_30d,{pp:true}))}
      ${kpi('','Dinero en riesgo', eur(a.fallos.importe_en_riesgo), 'de los fallos del periodo')}
    </div>

    <div class="sect">Qué hay que atender</div>
    <div class="todo">
      <button class="act ${a.fallos.sin_tocar?'alert':'ok'}" onclick="setTab('fallos')">
        <div class="lab">Fallos sin tocar</div><div class="val">${a.fallos.sin_tocar}</div>
        <div class="sub">${a.fallos.sin_tocar?`${pc(a.fallos.pct_sin_tocar)} siguen en «Pendiente contact» — nadie los ha llamado`:'ningún fallo sin gestionar 👌'}</div>
        <span class="go">Ver fallos de pago →</span></button>
      <button class="act ${sinIntento>0?'alert':'ok'}" onclick="setTab('bajas')">
        <div class="lab">Bajas sin intento</div><div class="val">${sinIntento}</div>
        <div class="sub">${sinIntento>0?`se fueron sin que nadie intentara retenerlas · intentamos con el ${pc(a.bajas.pct_intentos)}`:'intentamos retener a todas 👌'}</div>
        <span class="go">Ver solicitudes de baja →</span></button>
    </div>` + avisos;

  // Badge: los fallos sin tocar son dinero esperando una llamada.
  const bdg=document.getElementById('bdgFallos');
  bdg.textContent=a.fallos.sin_tocar||0;
  bdg.className='badge'+(a.fallos.sin_tocar?'':' calm');

  // ══════════ Evolución: una tabla por tema, no las dos mezcladas en 11 columnas ══════════
  const granTxt=document.getElementById('gran').selectedOptions[0].text.toLowerCase();
  const serie=(d.series||[]);
  const tabla=(titulo,hint,cols,peso)=>{
    const max=Math.max(1,...serie.map(peso));
    return `<div class="card">
      <h3>${titulo}</h3><p class="hint">${hint} Agrupado por ${granTxt}.</p>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>Periodo</th>${cols.map(c=>`<th class="num">${c.t}</th>`).join('')}<th></th></tr></thead>
        <tbody>${serie.length?serie.map(s=>`<tr><td><b>${esc(s.periodo)}</b></td>
          ${cols.map(c=>`<td class="num">${c.f(s)}</td>`).join('')}
          <td style="width:90px"><div class="bar"><i style="width:${Math.round(100*peso(s)/max)}%"></i></div></td></tr>`).join('')
          :`<tr><td colspan="${cols.length+2}" style="text-align:center;color:var(--muted);padding:24px">Sin datos en el periodo</td></tr>`}</tbody>
      </table></div></div>`;
  };

  // ══════════ TAB: SOLICITUDES DE BAJA ══════════
  PANES.bajas = `
    <div class="sect">Solicitudes de baja · repesca${hayCmp?` · comparado con ${ETIQ}`:''}</div>
    <div class="kpis">
      ${kpi('','Solicitudes', a.bajas.solicitudes, 'recibidas en el periodo', delta(a.bajas.solicitudes,p.bajas.solicitudes,{masEsMejor:false}))}
      ${kpi('','Intentos de retención', a.bajas.intentos_retencion, `${pc(a.bajas.pct_intentos)} de las solicitudes`, delta(a.bajas.pct_intentos,p.bajas.pct_intentos,{pp:true}))}
      ${kpi('','Repescadas', a.bajas.repescadas, `de ${a.bajas.intentos_retencion} intentos`, delta(a.bajas.repescadas,p.bajas.repescadas))}
      ${kpi('hero','Éxito del intento', pc(a.bajas.pct_exito_intento), `frente a ${pc(a.bajas.pct_vivas_total)} del total`, delta(a.bajas.pct_exito_intento,p.bajas.pct_exito_intento,{pp:true}))}
    </div>
    ${tabla('Evolución de las bajas','Cuántas solicitudes llegan, en cuántas intervenimos y cuántas se quedan.',
      [{t:'Solicitudes',f:s=>s.bajas.solicitudes},{t:'Intentos',f:s=>s.bajas.intentos_retencion},
       {t:'Repescadas',f:s=>s.bajas.repescadas},{t:'% éxito',f:s=>pc(s.bajas.pct_exito_intento)}],
      s=>s.bajas.solicitudes)}` + avisos;

  // ══════════ TAB: FALLOS DE PAGO ══════════
  PANES.fallos = `
    <div class="sect">Fallos de pago · rescate${hayCmp?` · comparado con ${ETIQ}`:''}</div>
    <div class="kpis">
      ${kpi('','Fallos', a.fallos.fichas, `${eur(a.fallos.importe_en_riesgo)} en riesgo`, delta(a.fallos.fichas,p.fallos.fichas,{masEsMejor:false}))}
      ${kpi('','Rescatados', a.fallos.rescatados, `${pc(a.fallos.pct_rescate)} del total`, delta(a.fallos.pct_rescate,p.fallos.pct_rescate,{pp:true}))}
      ${kpi('hero','Rescatados ≤30 días', pc(a.fallos.pct_rescate_30d), `${a.fallos.rescatados_30d} fichas · la única cifra comparable entre meses`, delta(a.fallos.pct_rescate_30d,p.fallos.pct_rescate_30d,{pp:true}))}
      ${kpi('','Sin tocar', a.fallos.sin_tocar, `${pc(a.fallos.pct_sin_tocar)} siguen en «Pendiente contact»`, delta(a.fallos.sin_tocar,p.fallos.sin_tocar,{masEsMejor:false}))}
    </div>
    ${tabla('Evolución de los fallos de pago','Fichas creadas y cuántas acabaron cobrando.',
      [{t:'Fallos',f:s=>s.fallos.fichas},{t:'Rescatados',f:s=>s.fallos.rescatados},
       {t:'% rescate',f:s=>pc(s.fallos.pct_rescate)},{t:'Sin tocar',f:s=>s.fallos.sin_tocar}],
      s=>s.fallos.fichas)}` + avisos;

  document.getElementById('tabs').style.display='flex';
  setTab(TAB);
}

function arrancar(){
  document.getElementById('overlay').style.display='none';
  document.getElementById('app').style.display='block';
  usarPreset('30d');
}
document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
document.getElementById('email').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
if(token) arrancar();
</script>
</body>
